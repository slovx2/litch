# 只接收签名证明，不运行传入命令，不签名、公证或发布产品。
name: Accept local Mac proof
on:
  workflow_dispatch:
    inputs:
      source-run:
        description: 容量失败的原始CI或Prepare run
        type: string
        required: true
      envelope:
        description: 本地入口生成的Ed25519签名证明（base64）
        type: string
        required: true
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  accept:
    if: github.ref_protected && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    environment: local-mac-fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - id: accept
        run: node scripts/ci/accept-local-mac.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_MAC_REF_PROTECTED: ${{ github.ref_protected }}
          LITCH_LOCAL_MAC_PUBLIC_KEY: ${{ vars.LITCH_LOCAL_MAC_PUBLIC_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-mac-${{ steps.accept.outputs.source }}-${{ github.run_attempt }}
          path: local-mac-envelope.json
          if-no-files-found: error
          retention-days: 14
