# 正式候选准备：只运行一次 Gate 和五类出包，不创建标签/Release。
# 签名机密见 CONTRIBUTING.md；缺失时失败，不允许临时签名候选晋级。
name: Prepare release candidate
on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: standard 沿用夜间规则；patch 仅允许最新正式版之后的少量线性补丁
        type: choice
        options: [standard, patch]
        default: standard
      base-tag:
        description: patch 必填上一正式版本标签；standard 不填
        type: string
        default: ''
      nightly-triage:
        description: 夜间失败与候选无关的已关闭分诊 issue 编号
        default: ''
        type: string
      bypass-gate:
        description: 本地检查通过后手动绕过检查门禁；不绕过签名、公证或同SHA产物核验
        type: boolean
        default: false
      bypass-reason:
        description: 开启bypass-gate时必填，记录本地检查和绕过原因
        type: string
        default: ''
      ios-testflight:
        description: 同 SHA 候选通过门禁后签名并上传 TestFlight（不提交 App Store 审核）
        type: boolean
        default: false
      ios-build-number:
        description: 上传 iOS 时必填且递增，例如 1.0.1
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  checks: read
  issues: read
concurrency:
  group: prepare-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      packed-check: ${{ inputs.bypass-gate || contains(fromJSON(steps.impact.outputs.domains || '[]'), 'client') || contains(fromJSON(steps.impact.outputs.domains || '[]'), 'adapters') || contains(fromJSON(steps.impact.outputs.domains || '[]'), 'client-engines') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 冻结候选源码与工作流提交
        id: freeze
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [ "$sha" != "$WORKFLOW_SHA" ]; then
            echo '候选必须与工作流同 SHA；手动发标签请同时选择该标签作为运行 ref' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: 版本一致性及同 SHA 去重
        env:
          GH_TOKEN: ${{ github.token }}
          BYPASS_GATE: ${{ inputs.bypass-gate }}
          BYPASS_REASON: ${{ inputs.bypass-reason }}
        run: |
          node scripts/check-versions.mjs
          node scripts/ci/release-preflight.mjs
      - name: 只读展示夜间监测心跳
        if: inputs.release-mode != 'patch' && !inputs.bypass-gate
        run: node scripts/ci/nightly-status.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      # 在候选阶段按同一规则计算，不等完整 Gate 结束，保持测试和出包并行。
      # 桌面、入口或未知影响加跑完整 packed；无可信夜间基线时规则会扩大到全量。
      - name: 判断完整签名包检查的影响范围
        if: ${{ !inputs.bypass-gate }}
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.freeze.outputs.sha }}
          NIGHTLY_RUNS_PATH: nightly-runs.json
          RELEASE_MODE: ${{ inputs.release-mode || 'standard' }}
          BASE_TAG: ${{ inputs.base-tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_MODE" = standard ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full.yml/runs?event=schedule&status=success&per_page=100" \
              --jq '.workflow_runs | map({id, head_sha, status, conclusion, event, updated_at, html_url, path, run_attempt})' > nightly-runs.json
          fi
          node scripts/ci-impact.mjs | tee packed-impact.json
          {
            echo '### 签名包完整检查的影响范围'
            echo '```json'
            cat packed-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    if: ${{ !inputs.bypass-gate }}
    needs: candidate
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
    uses: ./.github/workflows/gate.yml
    with:
      sha: ${{ needs.candidate.outputs.sha }}
      nightly-triage: ${{ inputs.nightly-triage || '' }}
      release-mode: ${{ inputs.release-mode || 'standard' }}
      base-tag: ${{ inputs.base-tag || '' }}
      mac-after-signing: true

  adapter:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      - run: npm run build
      - name: 安装脚本的静态检查
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck=0.9.0-1
          sh -n scripts/install.sh
          sh -n scripts/adapter-launcher.sh
          shellcheck --shell=sh scripts/install.sh scripts/adapter-launcher.sh
      # 三个平台的包在这一台机器上出：命令行是 Go 交叉编译的，Node 取各平台的官方包，
      # 其余依赖裁剪后全是纯 JavaScript（暂存时会查，混进了分平台的东西就不让过）
      - name: 出包
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/package-adapter.mjs --target all --out "${RUNNER_TEMP}/release"
          cat "${RUNNER_TEMP}/release/codex-harness-adapter-SHA256SUMS.txt"
      # 拿刚出的那个 linux-x64 的包，在干净的容器里把安装、连接、升级、卸载过一遍（含装一份 Pi 跑通一个回合），
      # musl 的系统给出明确的说法。验的就是要发的那一份
      - name: 容器验证
        run: node scripts/check-adapter-package.mjs --release "${RUNNER_TEMP}/release"
      - name: 产物来源与 SHA-256
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: node scripts/release-provenance.mjs write "${RUNNER_TEMP}/release" adapter
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: adapter-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  # 给集成方（WakeQora）的 Claude 入口包 cha-v<版本>.tar.gz 和它的校验和清单。在钉了摘要的容器里出，
  # 同一个提交在哪出都是同一个 sha256，集成方把清单里的值记进自己的锁文件
  cha:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: 出包
        run: bash scripts/package-cha.sh --out "${RUNNER_TEMP}/cha"
      - name: 产物来源与 SHA-256
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: node scripts/release-provenance.mjs write "${RUNNER_TEMP}/cha" cha
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cha-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/cha
          if-no-files-found: error

  desktop-macos:
    needs: candidate
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      MACOS_CHECKPOINT_DIR: ${{ github.workspace }}/macos-checkpoint
      # https://github.com/actions/runner-images/issues/14924；只在单条票据命令期间阻断 UDP443。
      LITCH_STAPLER_TCP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
      - name: 查找同源 Accepted 检查点
        id: checkpoint
        run: node apps/desktop/scripts/macos-checkpoint.mjs find "$MACOS_CHECKPOINT_DIR"
        env:
          GH_TOKEN: ${{ github.token }}
      # 证书放进一个临时的钥匙串，公证凭据用 notarytool 存进同一个钥匙串，用完一起删掉。
      # 签名身份从导入的证书里找“Developer ID Application”那一个
      - name: 导入签名证书和公证凭据
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in P12 P12_PASSWORD API_KEY API_KEY_ID API_ISSUER; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "签名和公证的机密不全，$name 对应的那一项是空的（见本文件开头）" >&2
              exit 1
            fi
          done
          umask 077
          keychain="${RUNNER_TEMP}/litch-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "导入的证书里没有 Developer ID Application 的签名身份" >&2
            exit 1
          fi
          echo "签名身份：$identity"
          # .p8 是 PEM 原文就照写，不是就当 base64 解开；存进钥匙串之后文件删掉
          key="${RUNNER_TEMP}/AuthKey_${API_KEY_ID}.p8"
          case "$API_KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$API_KEY" > "$key" ;;
            *) printf '%s' "$API_KEY" | base64 --decode > "$key" ;;
          esac
          xcrun notarytool store-credentials litch-ci --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$keychain" > /dev/null
          rm -f "$key"
          {
            echo "LITCH_SIGN_IDENTITY=$identity"
            echo "LITCH_SIGN_KEYCHAIN=$keychain"
            echo "LITCH_NOTARY_PROFILE=litch-ci"
            echo "LITCH_NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      - run: npm run build
      - run: npm run client:setup
      # Computer Use 的原生助手（apps/computer-use）：打包时由 client:pack 构建并放进应用的 SharedSupport，
      # 签名在下一步 make-installer.mjs 里（同一个开发者身份，加固的运行时）。这里先把它的单元测试跑一遍
      - name: Computer Use 助手的单元测试
        if: steps.checkpoint.outputs.restored != 'true'
        run: |
          swift --version
          swift test --package-path apps/computer-use
      - run: npm run client:pack
        if: steps.checkpoint.outputs.restored != 'true'
      - name: 签名并公证到 Accepted 检查点
        if: steps.checkpoint.outputs.restored != 'true'
        run: node apps/desktop/scripts/make-installer.mjs --require-signing --checkpoint-only
      - name: 上传 Accepted 检查点（不可分发）
        id: notarized
        if: steps.checkpoint.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-notarized-${{ github.run_attempt }}
          path: ${{ env.MACOS_CHECKPOINT_DIR }}/*
          if-no-files-found: error
          retention-days: 14
      - name: 绑定检查点不可变 ID 与摘要
        if: steps.checkpoint.outputs.restored != 'true'
        run: node apps/desktop/scripts/macos-checkpoint.mjs bind "$MACOS_CHECKPOINT_DIR"
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_ID: ${{ steps.notarized.outputs.artifact-id }}
          CHECKPOINT_DIGEST: ${{ steps.notarized.outputs.artifact-digest }}
      - name: 恢复 Accepted 包并钉票校验（不重新公证）
        run: node apps/desktop/scripts/macos-checkpoint.mjs finish "$MACOS_CHECKPOINT_DIR" apps/desktop/out
      # 应用自己的更新在 macOS 上下的是 zip（Squirrel.Mac 只认 zip），从签过、公证过、钉过票的那份应用打
      - name: 给自动更新打 zip
        run: |
          version="$(node -p "require('./package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "apps/desktop/out/Litch-darwin-arm64/Litch.app" "apps/desktop/out/installer/Litch-${version}-macos-arm64.zip"
      # 签过、钉过票的应用照样起得来：对着模拟核心起一次，界面和核心打通
      - name: 签好的应用启动（每个候选必跑）
        run: node apps/desktop/scripts/smoke.mjs --packed
      - name: 签名包完整发送与远程连接验收（按影响范围）
        if: needs.candidate.outputs.packed-check == 'true'
        run: npm run client:check:packed
      - name: 核对最终 dmg 和自动更新 zip
        run: node apps/desktop/scripts/verify-macos-distribution.mjs
      # 助手单独签过、和应用同一个团队（make-installer.mjs 已经比过）；这里再打出来留个底
      - name: Computer Use 助手的签名
        run: codesign -dv --verbose=2 "apps/desktop/out/Litch-darwin-arm64/Litch.app/Contents/SharedSupport/Litch Computer Use.app"
      - name: 收掉签名用的钥匙串
        if: always()
        run: |
          if [ -n "${LITCH_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$LITCH_SIGN_KEYCHAIN"
          fi
      - name: 产物来源与 SHA-256
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          MACOS_VALIDATED_CHECKPOINT: ${{ env.MACOS_CHECKPOINT_DIR }}/validated.json
        run: node scripts/release-provenance.mjs write "apps/desktop/out/installer" desktop-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-macos-${{ github.run_attempt }}
          retention-days: 14
          path: |
            apps/desktop/out/installer/*.dmg
            apps/desktop/out/installer/*.zip
            apps/desktop/out/installer/release-provenance-*.json
          if-no-files-found: error

  # Windows 的安装程序：不签名（打开时系统会提示来源不明），这里只出包、不验收（真机验收另做）。
  # 带 Computer Use 的助手（apps/computer-use-win，Rust）：打包前先构建，打包和做安装包都核对它在
  desktop-windows:
    needs: candidate
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
      # 机器上已经有这一版时 choco 什么都不做；版本不对就装成这一版
      - name: Inno Setup 6.7.1
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      # 工具链的版本只在 rust-toolchain.toml 里写（乙线定），rustup 在 crate 目录里按它装、按它用
      - name: Rust 工具链（apps/computer-use-win/rust-toolchain.toml）
        working-directory: apps/computer-use-win
        run: |
          rustup set auto-self-update disable
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
      - name: Computer Use 助手
        working-directory: apps/computer-use-win
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: npm run build
      - run: npm run client:setup
      - run: node apps/desktop/scripts/check-computer-use.mjs --require
      - run: npm run client:pack
      - run: node apps/desktop/scripts/make-installer.mjs
      - name: 产物来源与 SHA-256
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: node scripts/release-provenance.mjs write "apps/desktop/out/installer" desktop-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-${{ github.run_attempt }}
          retention-days: 14
          path: |
            apps/desktop/out/installer/*.exe
            apps/desktop/out/installer/release-provenance-*.json
          if-no-files-found: error

  # 安卓应用：arm64 的 release 包，发版钥匙签名（apps/mobile/plugins/release-signing.js 在 prebuild 时把签名接进生成的 gradle）。
  # 装上去之后的整套验收在全量（full.yml 的 mobile）里，这里只出包、核对签名
  android:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # 发版钥匙的证书指纹（SHA-256）：签出来的包对不上就不发
      RELEASE_CERT_SHA256: 61b7ed82ed03a87efd86f9ba7a7a0a93b328426e33586b3ba3330c0e9efcdfdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: mobile/go.sum
      - name: JDK 17
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
      - name: 取出签名钥匙
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_P12 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo '正式候选必须配置全部 Android 签名机密' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "${RUNNER_TEMP}/litch-release.p12"
          {
            echo "LITCH_ANDROID_KEYSTORE=${RUNNER_TEMP}/litch-release.p12"
            echo "LITCH_ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "LITCH_ANDROID_KEY_ALIAS=${KEY_ALIAS}"
            echo "LITCH_ANDROID_KEY_PASSWORD=${KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      # 终端页的网页（npm run web:build）用的是界面包里的那份 xterm
      - run: npm ci --prefix packages/ui --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: 打 release 包
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_LITCH_E2E: '0'
        run: |
          npx expo prebuild --platform android --clean --no-install
          npm run android:release -- --max-workers=4 -PreactNativeArchitectures=arm64-v8a
      - name: 核对签名，改成发布的名字
        run: |
          version="$(node -p "require('./package.json').version")"
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "${RUNNER_TEMP}/certs.txt"
          node scripts/ci/release-apk.mjs "$apk"
          if [ -n "${LITCH_ANDROID_KEYSTORE:-}" ]; then
            if ! grep -qi "certificate SHA-256 digest: ${RELEASE_CERT_SHA256}" "${RUNNER_TEMP}/certs.txt"; then
              echo "签出来的包不是发版钥匙签的（证书指纹对不上）" >&2
              exit 1
            fi
          fi
          mkdir -p "${RUNNER_TEMP}/android"
          cp "$apk" "${RUNNER_TEMP}/android/Litch-${version}-android-arm64.apk"
      - name: 收掉签名钥匙
        if: always()
        run: rm -f "${RUNNER_TEMP}/litch-release.p12"
      - name: 产物来源与 SHA-256
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: node scripts/release-provenance.mjs write "${RUNNER_TEMP}/android" android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-${{ github.run_attempt }}
          retention-days: 14
          path: ${{ runner.temp }}/android
          if-no-files-found: error

  # iOS 经 App Store Connect 分发，不加入 GitHub Release 的五类公开资产。
  # 首次接入放在 seal 后，禁止绕过 Gate 上传；导出、校验和上传使用同一份 IPA。
  ios-testflight:
    needs: [candidate, seal]
    if: ${{ inputs.ios-testflight && !inputs.bypass-gate && needs.seal.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LITCH_IOS_BUILD_NUMBER: ${{ inputs.ios-build-number }}
      LITCH_IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: mobile/go.sum
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with:
          ruby-version: 3.4.7
      - name: 安装锁定的构建依赖
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix packages/ui --no-audit --no-fund
          npm ci --prefix apps/mobile --no-audit --no-fund
          gem install cocoapods --version 1.16.2 --no-document
      - name: 正式归档、校验 IPA 并上传 TestFlight
        env:
          LITCH_ASC_PRIVATE_KEY: ${{ secrets.IOS_ASC_PRIVATE_KEY }}
          LITCH_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          LITCH_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          LITCH_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          LITCH_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          LITCH_APP_STORE_PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE }}
          LITCH_IOS_OUTPUT: ${{ runner.temp }}/litch-ios-release
        run: node scripts/ci/ios-testflight.mjs

  seal:
    needs: [candidate, gate, adapter, cha, desktop-macos, desktop-windows, android]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (needs.gate.result == 'success' || (inputs.bypass-gate && needs.gate.result == 'skipped')) && needs.adapter.result == 'success' && needs.cha.result == 'success' && needs.desktop-macos.result == 'success' && needs.desktop-windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      NIGHTLY_TRIAGE: ${{ inputs.nightly-triage }}
      GH_TOKEN: ${{ github.token }}
      BYPASS_GATE: ${{ inputs.bypass-gate }}
      BYPASS_REASON: ${{ inputs.bypass-reason }}
      RELEASE_MODE: ${{ inputs.release-mode || 'standard' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: 校验同源五类产物、Gate 与 Full 并封存摘要
        run: node scripts/ci/release-seal.mjs "${RUNNER_TEMP}/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: verified
        with:
          name: verified-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14
      - name: 晋级参数（只用明确 ID，禁止找同名最新产物）
        env:
          ARTIFACT_ID: ${{ steps.verified.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.verified.outputs.artifact-digest }}
        run: |
          {
            echo "source-run: $GITHUB_RUN_ID"
            echo "source-attempt: $GITHUB_RUN_ATTEMPT"
            echo "candidate-sha: $CANDIDATE_SHA"
            echo "artifact-id: $ARTIFACT_ID"
            echo "artifact-digest: sha256:$ARTIFACT_DIGEST"
            echo '先用 promote.yml mode=verify 验证；公开须人工授权，不能再运行 Prepare。'
          } >> "$GITHUB_STEP_SUMMARY"
