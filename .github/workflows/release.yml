name: Release

# 出这一版要发的全部东西，挂到这个标签的发布页：
#   适配器的独立发布包（linux-x64、linux-arm64、darwin-arm64）、它的校验和清单、安装脚本
#   桌面应用 Litch 的安装包：macOS（Apple Silicon）签名并公证过的 dmg，Windows（x64）的安装程序（不签名，还没有经过完整的测试）
#   安卓应用（arm64）：发版钥匙签名的 apk
#   应用自己的更新：macOS 的 zip（Squirrel 下这个）和更新清单 litch-update.json，
#   三个端都从“最新一版”下面取这份清单，草稿不算，人公开之后才收得到
# 打 v 开头的标签时自动跑。也可以手动跑：
#   填一个已有的标签：给它出包、验证，勾了“挂到发布页”才挂上去
#   标签不填：照选的分支试跑一遍，只出包、验证、留作流程产物，不挂发布页，也不查版本号和标签对不对得上
# 挂之前要求标签指的提交上有一轮通过的全量（full.yml，手动触发）：门禁只跑冒烟，0.8.0 那种在 Codex 上建不成会话的问题
# 要全量才拦得全。没有就不挂，先 gh workflow run full.yml --ref <那个提交所在的分支>，过了再重跑这一趟。
# 全部出好才一起挂上去；发布页还没有时建成草稿，人看过再公开，安装脚本取“最新一版”时不会碰到一个缺包的发布页。
#
# macOS 的签名和公证要在仓库的 Actions 机密里配好这五项（怎么取见 CONTRIBUTING.md 的“发版”一节）：
#   MACOS_CERTIFICATE_P12        “Developer ID Application”证书连同私钥导出的 .p12，base64 编码
#   MACOS_CERTIFICATE_PASSWORD   导出 .p12 时设的密码
#   APPLE_API_KEY                App Store Connect 的 API 密钥（.p8 文件的内容，原文或者 base64 都行），公证用
#   APPLE_API_KEY_ID             这把密钥的编号
#   APPLE_API_ISSUER             签发者编号（Issuer ID）
# 试跑时没配就出一份只有临时签名的 dmg 并说明；要挂到发布页时没配直接失败。
#
# 安卓的签名要这三项（钥匙库的原件和密码在维护者电脑的 ~/Documents/litch-android-release/，见那里的 README）：
#   ANDROID_KEYSTORE_P12         钥匙库（PKCS12），base64 编码
#   ANDROID_KEYSTORE_PASSWORD    钥匙库和钥匙的密码（PKCS12 里两者是同一个）
#   ANDROID_KEY_ALIAS            钥匙的别名
# 试跑时没配就用调试钥匙签并说明（那样的包装不到装了正式版的手机上）；要挂到发布页时没配直接失败。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 给哪个标签出包，例如 v0.7.1（标签要已经推上来）；不填就照选的分支试跑，不挂发布页
        required: false
        default: ''
        type: string
      publish:
        description: 挂到发布页（只对填了标签的有用）
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # 查这个提交上的全量过没过
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 出包用的提交：标签，或者试跑时选的分支
  REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  # 要发的标签，试跑时是空的
  TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name || '') }}
  # 这一趟要不要挂到发布页
  PUBLISH: ${{ github.event_name == 'push' || (inputs.tag != '' && inputs.publish) }}

jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - name: 标签和版本号要对得上
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "标签是 ${TAG}，package.json 里的版本号是 ${version}" >&2
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      - run: npm run build
      - name: 安装脚本的静态检查
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck=0.9.0-1
          sh -n scripts/install.sh
          sh -n scripts/adapter-launcher.sh
          shellcheck --shell=sh scripts/install.sh scripts/adapter-launcher.sh
      # 三个平台的包在这一台机器上出：命令行是 Go 交叉编译的，Node 取各平台的官方包，
      # 其余依赖裁剪后全是纯 JavaScript（暂存时会查，混进了分平台的东西就不让过）
      - name: 出包
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node scripts/package-adapter.mjs --target all --out "${RUNNER_TEMP}/release"
          cat "${RUNNER_TEMP}/release/codex-harness-adapter-SHA256SUMS.txt"
      # 拿刚出的那个 linux-x64 的包，在干净的容器里把安装、连接、升级、卸载过一遍（含装一份 Pi 跑通一个回合），
      # musl 的系统给出明确的说法。验的就是要发的那一份
      - name: 容器验证
        run: node scripts/check-adapter-package.mjs --release "${RUNNER_TEMP}/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: adapter
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - name: 标签和版本号要对得上
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "标签是 ${TAG}，package.json 里的版本号是 ${version}" >&2
            exit 1
          fi
      # 证书放进一个临时的钥匙串，公证凭据用 notarytool 存进同一个钥匙串，用完一起删掉。
      # 签名身份从导入的证书里找“Developer ID Application”那一个
      - name: 导入签名证书和公证凭据
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$P12" ] && [ -z "$API_KEY" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "要挂到发布页的 dmg 必须签名并公证，可仓库里没有配签名证书和公证凭据（见本文件开头）" >&2
              exit 1
            fi
            echo "::warning::没有配签名证书和公证凭据，这一趟出的 dmg 只有临时签名"
            exit 0
          fi
          for name in P12 P12_PASSWORD API_KEY API_KEY_ID API_ISSUER; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "签名和公证的机密不全，$name 对应的那一项是空的（见本文件开头）" >&2
              exit 1
            fi
          done
          umask 077
          keychain="${RUNNER_TEMP}/litch-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "导入的证书里没有 Developer ID Application 的签名身份" >&2
            exit 1
          fi
          echo "签名身份：$identity"
          # .p8 是 PEM 原文就照写，不是就当 base64 解开；存进钥匙串之后文件删掉
          key="${RUNNER_TEMP}/AuthKey_${API_KEY_ID}.p8"
          case "$API_KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$API_KEY" > "$key" ;;
            *) printf '%s' "$API_KEY" | base64 --decode > "$key" ;;
          esac
          xcrun notarytool store-credentials litch-ci --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --keychain "$keychain" > /dev/null
          rm -f "$key"
          {
            echo "LITCH_SIGN_IDENTITY=$identity"
            echo "LITCH_SIGN_KEYCHAIN=$keychain"
            echo "LITCH_NOTARY_PROFILE=litch-ci"
            echo "LITCH_NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      - run: npm run build
      - run: npm run client:setup
      # Computer Use 的原生助手（apps/computer-use）：打包时由 client:pack 构建并放进应用的 SharedSupport，
      # 签名在下一步 make-installer.mjs 里（同一个开发者身份，加固的运行时）。这里先把它的单元测试跑一遍
      - name: Computer Use 助手的单元测试
        run: |
          swift --version
          swift test --package-path apps/computer-use
      - run: npm run client:pack
      - name: 签名、公证，做成 dmg
        run: |
          if [ "$PUBLISH" = true ]; then
            node apps/desktop/scripts/make-installer.mjs --require-signing
          else
            node apps/desktop/scripts/make-installer.mjs
          fi
      # 应用自己的更新在 macOS 上下的是 zip（Squirrel.Mac 只认 zip），从签过、公证过、钉过票的那份应用打
      - name: 给自动更新打 zip
        run: |
          version="$(node -p "require('./package.json').version")"
          ditto -c -k --sequesterRsrc --keepParent "apps/desktop/out/Litch-darwin-arm64/Litch.app" "apps/desktop/out/installer/Litch-${version}-macos-arm64.zip"
      # 签过、钉过票的应用照样起得来：对着模拟核心起一次，界面和核心打通
      - name: 签好的应用能起来
        run: node apps/desktop/scripts/smoke.mjs --packed
      # 助手单独签过、和应用同一个团队（make-installer.mjs 已经比过）；这里再打出来留个底
      - name: Computer Use 助手的签名
        run: codesign -dv --verbose=2 "apps/desktop/out/Litch-darwin-arm64/Litch.app/Contents/SharedSupport/Litch Computer Use.app"
      - name: 收掉签名用的钥匙串
        if: always()
        run: |
          if [ -n "${LITCH_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$LITCH_SIGN_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-macos
          path: |
            apps/desktop/out/installer/*.dmg
            apps/desktop/out/installer/*.zip
          if-no-files-found: error

  # Windows 的安装程序：不签名（打开时系统会提示来源不明），这里只出包、不验收（真机验收另做）。
  # 带 Computer Use 的助手（apps/computer-use-win，Rust）：打包前先构建，打包和做安装包都核对它在
  desktop-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - name: 标签和版本号要对得上
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "标签是 ${TAG}，package.json 里的版本号是 ${version}" >&2
            exit 1
          fi
      # 机器上已经有这一版时 choco 什么都不做；版本不对就装成这一版
      - name: Inno Setup 6.7.1
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      # 工具链的版本只在 rust-toolchain.toml 里写（乙线定），rustup 在 crate 目录里按它装、按它用
      - name: Rust 工具链（apps/computer-use-win/rust-toolchain.toml）
        working-directory: apps/computer-use-win
        run: |
          rustup set auto-self-update disable
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
      - name: Computer Use 助手
        working-directory: apps/computer-use-win
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - run: npm run build
      - run: npm run client:setup
      - run: node apps/desktop/scripts/check-computer-use.mjs --require
      - run: npm run client:pack
      - run: node apps/desktop/scripts/make-installer.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows
          path: apps/desktop/out/installer/*.exe
          if-no-files-found: error

  # 安卓应用：arm64 的 release 包，发版钥匙签名（apps/mobile/plugins/release-signing.js 在 prebuild 时把签名接进生成的 gradle）。
  # 装上去之后的整套验收在全量（full.yml 的 mobile）里，这里只出包、核对签名
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # 发版钥匙的证书指纹（SHA-256）：签出来的包对不上就不发
      RELEASE_CERT_SHA256: 61b7ed82ed03a87efd86f9ba7a7a0a93b328426e33586b3ba3330c0e9efcdfdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - name: 标签和版本号要对得上
        if: env.TAG != ''
        run: |
          version="$(node -p "require('./package.json').version")"
          mobile="$(node -p "require('./apps/mobile/app.json').expo.version")"
          if [ "v${version}" != "${TAG}" ] || [ "v${mobile}" != "${TAG}" ]; then
            echo "标签是 ${TAG}，package.json 里是 ${version}，apps/mobile/app.json 里是 ${mobile}" >&2
            exit 1
          fi
      - name: JDK 17
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
      - name: 取出签名钥匙
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_P12 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            if [ "$PUBLISH" = true ]; then
              echo "要挂到发布页的安卓包必须用发版钥匙签，可仓库里的安卓签名机密不全（见本文件开头）" >&2
              exit 1
            fi
            echo "::warning::没有配安卓签名机密，这一趟的 apk 用调试钥匙签"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "${RUNNER_TEMP}/litch-release.p12"
          {
            echo "LITCH_ANDROID_KEYSTORE=${RUNNER_TEMP}/litch-release.p12"
            echo "LITCH_ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "LITCH_ANDROID_KEY_ALIAS=${KEY_ALIAS}"
            echo "LITCH_ANDROID_KEY_PASSWORD=${KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      # 终端页的网页（npm run web:build）用的是界面包里的那份 xterm
      - run: npm ci --prefix packages/ui --no-audit --no-fund
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
      - name: 打 release 包
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install
          npm run android:release -- --max-workers=4 -PreactNativeArchitectures=arm64-v8a
      - name: 核对签名，改成发布的名字
        run: |
          version="$(node -p "require('./package.json').version")"
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "${RUNNER_TEMP}/certs.txt"
          if [ -n "${LITCH_ANDROID_KEYSTORE:-}" ]; then
            if ! grep -qi "certificate SHA-256 digest: ${RELEASE_CERT_SHA256}" "${RUNNER_TEMP}/certs.txt"; then
              echo "签出来的包不是发版钥匙签的（证书指纹对不上）" >&2
              exit 1
            fi
          fi
          mkdir -p "${RUNNER_TEMP}/android"
          cp "$apk" "${RUNNER_TEMP}/android/Litch-${version}-android-arm64.apk"
      - name: 收掉签名钥匙
        if: always()
        run: rm -f "${RUNNER_TEMP}/litch-release.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android
          path: ${{ runner.temp }}/android/*.apk
          if-no-files-found: error

  publish:
    needs: [adapter, desktop-macos, desktop-windows, android]
    if: github.event_name == 'push' || (inputs.tag != '' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 这个提交上要有一轮通过的全量
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
          passed="$(gh run list --workflow full.yml --commit "${sha}" --status success --limit 1 --json databaseId --jq length)"
          if [ "${passed}" != "1" ]; then
            echo "${TAG}（${sha}）上没有通过的全量：先 gh workflow run full.yml，过了再重跑这一趟" >&2
            exit 1
          fi
      # 只为了下面生成更新清单的那个脚本
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REF }}
          sparse-checkout: scripts/update-manifest.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: 应用安装包的校验和清单
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum Litch-*.dmg Litch-*-setup.exe Litch-*.apk Litch-*-macos-arm64.zip > Litch-SHA256SUMS.txt
          cat Litch-SHA256SUMS.txt
      - name: 更新清单
        run: node scripts/update-manifest.mjs --dir "${RUNNER_TEMP}/release" --tag "${TAG}" --repo "${GITHUB_REPOSITORY}"
      - name: 挂到发布页
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --draft --verify-tag --title "${TAG}" --generate-notes
          fi
          gh release upload "${TAG}" --clobber \
            codex-harness-adapter-*.tar.gz \
            codex-harness-adapter-SHA256SUMS.txt \
            install.sh \
            Litch-*.dmg \
            Litch-*-setup.exe \
            Litch-*-macos-arm64.zip \
            Litch-*-android-arm64.apk \
            Litch-SHA256SUMS.txt \
            litch-update.json
