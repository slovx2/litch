name: Nightly mobile follow-up
# 独立观察器，不给可复用 Full 的调用链提升写权限，也不执行 artifact 中的代码。
on:
  workflow_run:
    workflows: [Full]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: nightly-mobile-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  follow-up:
    if: github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - run: node scripts/ci/release-nightly-mobile.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RUN: ${{ github.event.workflow_run.id }}
