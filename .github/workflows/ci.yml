# 门禁：每次推送和合并请求都跑，只放关键的冒烟，墙钟控制在 20 分钟以内（macOS 跑机要排队，门禁里只用一台）。
# 全量（各平台、各引擎、全部桌面验收、移动端模拟器上的端到端）在 full.yml，夜间、手动或按领域触发；
# 全量经 workflow_call 把这一份整个带上，门禁有的全量一定有。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        type: string
        default: ''
      include-browser:
        type: boolean
        default: true

# 每次调用独立并发组，Full 和发布门禁不能互相取消同 SHA 的验收。
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

env:
  npm_config_cache: ${{ github.workspace }}/.artifacts/npm-cache
  electron_config_cache: ${{ github.workspace }}/.artifacts/electron-cache

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      sha: ${{ inputs.sha || github.sha }}

  # 代码规范、类型检查，Pi、设备进程、Go、ACP 引擎、移动端的单元测试，本机 ssh 的链路
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-4
        with:
          go-version: 1.26.10
      - name: Linux 沙箱依赖
        id: phase-20
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
      - run: npm ci --no-audit --no-fund
        id: phase-19
      - run: npm ci --prefix packages/claude --no-audit --no-fund
        id: phase-18
      - run: npm ci --prefix packages/pi --no-audit --no-fund
        id: phase-17
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
        id: phase-16
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
        id: phase-15
      - run: npm ci --prefix packages/acp --no-audit --no-fund
        id: phase-14
      - name: 安装隔离的测试 CLI
        id: phase-13
        run: |
          npm install --prefix .artifacts/host-cli --save-exact @anthropic-ai/claude-code@2.1.282 --no-audit --no-fund
          echo "CHA_CLAUDE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-cli/node_modules/.bin/claude" >> "${GITHUB_ENV}"
      - run: node --test --test-concurrency=1 scripts/ci/*.test.mjs
        id: stage-13
      - run: npm run check
        id: phase-12
      - run: npm run typecheck
        id: phase-11
      - run: npm run build
        id: phase-10
      # 纯逻辑单测不需要手机依赖；原生 Markdown 与 WASM 对照在 full.yml 的 mobile 作业执行
      - run: npm run mobile:test
        id: phase-9
      - run: node scripts/ci/test-shard.mjs pi
        id: phase-8
      - run: node scripts/ci/test-shard.mjs device
        id: phase-7
      - run: go test ./...
        id: phase-6
      - name: 安装隔离的 DSH 与 OpenCode 测试 CLI
        id: phase-5
        run: |
          dsh="$(node -p "require('./protocol/versions.json').dshMinimum")"
          opencode="$(node -p "require('./protocol/versions.json').opencodeVerified[0]")"
          npm install --prefix .artifacts/host-dsh --save-exact "@deepseek-ai/dsh@${dsh}" --no-audit --no-fund
          npm install --prefix .artifacts/host-opencode --save-exact "opencode-ai@${opencode}" --no-audit --no-fund
          echo "CHA_DSH_CLI=${GITHUB_WORKSPACE}/.artifacts/host-dsh/node_modules/.bin/dsh" >> "${GITHUB_ENV}"
          echo "CHA_OPENCODE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-opencode/node_modules/.bin/opencode" >> "${GITHUB_ENV}"
      - run: npm run test:dsh
        id: phase-4
      - run: npm run test:opencode
        id: phase-3
      - run: npm run test:acp
        id: phase-2
      - run: npm run test:local-ssh
        id: phase-1

      - name: 缓存与首次失败
        id: stage-26
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  # Claude 按独立文件分两片；隔离 HOME，保留包内预加载、并发与超时。
  unit-claude:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-4
        with:
          go-version: 1.26.10
      - name: Linux 沙箱依赖
        id: phase-6
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
      - run: npm ci --no-audit --no-fund
        id: phase-5
      - run: npm ci --prefix packages/claude --no-audit --no-fund
        id: phase-4
      - name: 安装隔离的测试 CLI
        id: phase-3
        run: |
          npm install --prefix .artifacts/host-cli --save-exact @anthropic-ai/claude-code@2.1.282 --no-audit --no-fund
          echo "CHA_CLAUDE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-cli/node_modules/.bin/claude" >> "${GITHUB_ENV}"
      - run: npm run build --prefix packages/claude && node scripts/build-cli.mjs
        id: phase-2
      - run: node scripts/ci/test-shard.mjs claude ${{ matrix.shard }}/2
        id: phase-1

      - name: 缓存与首次失败
        id: stage-11
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  # 客户端的冒烟（窗口不显示）：核心的单元测试（含发给原生 codex 的参数照上游约束核对），界面构建，
  # 外壳对着模拟核心和真实入口各起一次，检查关键审批/发送，再在六个真实 harness 上从界面建会话
  # 跑头一个回合（0.8.0 在 Codex 上一个会话都建不成，就是这一条该拦住的），codex 收不收 Litch 的工具定义，
  # 本机内置适配器的拉起与换版本。其余的桌面验收在 full.yml
  client:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/linux-desktop.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
      suites: '["desktop-portable-unit","desktop-required"]'
      identity: ci-client

  # 浏览器含真实Mac Keychain/Node-API用例，Linux证据不替代这些覆盖。
  browser:
    if: ${{ toJSON(inputs.include-browser) != 'false' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - run: npm ci --prefix apps/desktop --no-audit --no-fund
      - run: npm run test:browser --prefix apps/desktop

  protocol-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - name: Cargo 工具链指纹
        id: rust
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache-cargo
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('Cargo.lock') }}-${{ inputs.sha || github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('Cargo.lock') }}-
      - run: cargo test --workspace --locked
        id: phase-1
      - name: 缓存与首次失败
        id: stage-6
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  report:
    if: always()
    needs: [windows, unit, unit-claude, client, browser, protocol-fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - run: node scripts/ci/run-summary.mjs
        id: stage-3
        env:
          GITHUB_TOKEN: ${{ github.token }}
