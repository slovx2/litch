# 门禁：每次推送和合并请求都跑，只放关键的冒烟，墙钟控制在 20 分钟以内（macOS 跑机要排队，门禁里只用一台）。
# 全量（各平台、各引擎、全部桌面验收、移动端模拟器上的端到端）在 full.yml，不自动跑，发版前和动了大块之后手动触发。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个分支或合并请求上新的推送来了，旧的那一轮就不用跑完了
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  # 代码规范、类型检查，Pi、设备进程、Go、ACP 引擎、移动端的单元测试，本机 ssh 的链路
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - name: Linux 沙箱依赖
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      - name: 安装隔离的测试 CLI
        run: |
          npm install --prefix .artifacts/host-cli --save-exact @anthropic-ai/claude-code@2.1.282 --no-audit --no-fund
          echo "CHA_CLAUDE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-cli/node_modules/.bin/claude" >> "${GITHUB_ENV}"
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run mobile:test
      - run: npm run test --prefix packages/pi
      - run: npm run test --prefix packages/device
      - run: go test ./...
      - run: npm run test:acp
      - run: npm run test:local-ssh

  # Claude Code 入口的单元测试单独一台：它一家要七分钟左右，和上面并着跑
  unit-claude:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - name: Linux 沙箱依赖
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - name: 安装隔离的测试 CLI
        run: |
          npm install --prefix .artifacts/host-cli --save-exact @anthropic-ai/claude-code@2.1.282 --no-audit --no-fund
          echo "CHA_CLAUDE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-cli/node_modules/.bin/claude" >> "${GITHUB_ENV}"
      - run: npm run test --prefix packages/claude

  # 客户端的冒烟（窗口不显示）：核心的单元测试（含发给原生 codex 的参数照上游约束核对），界面构建，
  # 外壳对着模拟核心和真实入口各起一次，对着真实入口发消息，再在真的原生 codex 和 Pi 上从界面建会话跑头一个回合
  # （0.8.0 在 Codex 上一个会话都建不成，就是这一条该拦住的）。其余的桌面验收在 full.yml
  client:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      # 带终端的进程由适配器命令行（Go）的 pty-bridge 子命令来起
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      - run: npm run client:setup
      - name: 安装隔离的原生 codex
        run: |
          codex="$(node -p "require('./protocol/versions.json').codexVerified[0]")"
          npm install --prefix .artifacts/host-codex --save-exact "@openai/codex@${codex}" --no-audit --no-fund
          echo "CHA_CODEX_CLI=${GITHUB_WORKSPACE}/.artifacts/host-codex/node_modules/.bin/codex" >> "${GITHUB_ENV}"
      - run: npm run client:typecheck
      - run: npm run client:test
      - run: npm run client:test:ui
      - run: npm run build
      - run: npm run client:smoke
      - run: npm run client:smoke:entry
      - run: npm run client:check:compose:entry
      - run: npm run client:check:first-turn

  protocol-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo test --workspace --locked
