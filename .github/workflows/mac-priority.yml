name: Wait for candidate signing
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      after-signing:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: 同候选签名成功后再申请Mac
        if: inputs.after-signing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: node scripts/ci/mac-priority.mjs
