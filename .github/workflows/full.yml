# 全量：门禁、各平台/引擎、桌面验收及手机静态检查与 APK 构建；手机模拟器 E2E 只按需手动开启。
# 每晚北京时间 03:17 跑全量，也可手动或按领域复用；发布是否公开仍由用户决定。
name: Full
on:
  workflow_dispatch:
    inputs:
      domains:
        description: '完整领域的 JSON 数组；留空执行全量'
        type: string
        default: ''
      sha:
        description: '待验源码 SHA；留空使用本次工作流 SHA'
        type: string
        default: ''
      run-ci:
        description: '同时执行 CI 必跑集合'
        type: boolean
        default: true
      mobile-e2e:
        description: '手动运行手机模拟器三片；需同时选择 mobile 领域'
        type: boolean
        default: false
      mobile-disable-vulkan:
        description: '手机稳定性实验：仅禁用模拟器 Vulkan，保持一次基础设施重试上限'
        type: boolean
        default: false
  schedule:
    - cron: '17 19 * * *'
  workflow_call:
    inputs:
      mac-after-signing:
        type: boolean
        default: false
      domains:
        type: string
        default: '["adapters","computer-use","computer-use-windows","client","dsh","opencode","client-engines","real-engines","mobile"]'
      sha:
        type: string
        default: ''
      run-ci:
        type: boolean
        default: true
      mobile-e2e:
        type: boolean
        default: false
      mobile-disable-vulkan:
        type: boolean
        default: false

env:
  npm_config_cache: ${{ github.workspace }}/.artifacts/npm-cache
  electron_config_cache: ${{ github.workspace }}/.artifacts/electron-cache

jobs:
  # dispatch 的 sha 可以和调度提交不同：先解析一次，所有测试统一检出这个不可变 SHA。
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      native-domains: ${{ steps.native.outputs.domains }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: 冻结实际待验源码
        id: freeze
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - id: native
        env:
          FULL_DOMAINS: ${{ inputs.domains || '' }}
          FULL_RUN_CI: ${{ toJSON(inputs.run-ci) != 'false' }}
        run: node scripts/ci/mac-native-plan.mjs

  gate:
    needs: source
    if: ${{ toJSON(inputs.run-ci) != 'false' }}
    # 被调用的 CI 汇总需要读 Actions；可复用工作流不能提升调用方的权限。
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      include-browser: false

  adapters:
    needs: [source, adapters-linux, adapters-macos]
    if: ${{ always() && (!inputs.domains || contains(fromJSON(inputs.domains), 'adapters')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: 阻断失败的上游
        env:
          LINUX: ${{ needs.adapters-linux.result }}
          MACOS: ${{ needs.adapters-macos.result }}
        run: |
          if [ "$LINUX" != success ] || [ "$MACOS" != success ]; then
            echo '::error::LITCH_RECOVERY_UPSTREAM_FAILURE'
            exit 1
          fi
  native:
    needs: source
    if: ${{ needs.source.outputs.native-domains != '[]' }}
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/mac-native.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      domains: ${{ needs.source.outputs.native-domains }}
      after-signing: ${{ inputs.mac-after-signing || false }}

  # run-ci=false时，完整client域仍须覆盖原来包含的纯单测/类型。
  client-unit:
    needs: source
    if: ${{ toJSON(inputs.run-ci) == 'false' && (!inputs.domains || contains(fromJSON(inputs.domains), 'client')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/linux-desktop.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      suites: '["desktop-portable-unit"]'
      identity: full-client-unit

  adapters-linux:
    needs: source
    if: ${{ !inputs.domains || contains(fromJSON(inputs.domains), 'adapters') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        suite: [claude, platform]
      max-parallel: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-4
        with:
          go-version: 1.26.10
      - name: Linux 沙箱依赖
        id: phase-17
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
      - run: npm ci --no-audit --no-fund
        id: phase-16
      - run: npm ci --prefix packages/claude --no-audit --no-fund
        id: phase-15
      - run: npm ci --prefix packages/pi --no-audit --no-fund
        id: phase-14
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
        id: phase-13
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
        id: phase-12
      - run: npm ci --prefix packages/acp --no-audit --no-fund
        id: phase-11
      - name: 安装隔离的测试 CLI
        id: phase-10
        run: |
          npm install --prefix .artifacts/host-cli --save-exact @anthropic-ai/claude-code@2.1.282 --no-audit --no-fund
          echo "CHA_CLAUDE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-cli/node_modules/.bin/claude" >> "${GITHUB_ENV}"
      - if: matrix.suite == 'platform'
        id: stage-13
        run: npm run check
      - if: matrix.suite == 'platform'
        id: stage-14
        run: npm run typecheck
      - run: npm run build
        id: phase-9
      # 含协议兼容性的两项测试（回放、结构校验，各包的 upstream-compat.test.mts）：
      # Claude Code、Pi 两个入口和设备聚合面在这里，dsh 入口的在下面的 dsh job 里
      - name: 准备分片 HOME
        id: stage-16
        run: mkdir -p "${RUNNER_TEMP}/adapter-test-home"
      - name: Claude 文件集合
        id: phase-8
        if: matrix.suite == 'claude'
        run: node scripts/ci/test-shard.mjs claude
      - name: Pi、设备和 Go 包
        id: phase-7
        if: matrix.suite == 'platform'
        run: |
          node scripts/ci/test-shard.mjs pi
          node scripts/ci/test-shard.mjs device
          npm run test:antigravity
          GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" HOME="${RUNNER_TEMP}/adapter-test-home" go test ./...
      # 按模型窗口需要较新的 CLI；单独隔离，不改变其余测试的 2.1.282 基线。
      - name: Claude 按供应商与模型自动压缩窗口
        id: phase-6
        if: matrix.suite == 'platform'
        run: |
          npm install --prefix .artifacts/context-cli --save-exact "@anthropic-ai/claude-code@$(node -p 'require("./protocol/versions.json").claudeContextCli')" --no-audit --no-fund
          CHA_CLAUDE_CLI="${GITHUB_WORKSPACE}/.artifacts/context-cli/node_modules/.bin/claude" node --import ./packages/claude/dist/claude/test/fixtures/isolate-process.mjs --test --test-force-exit packages/claude/dist/claude/test/context-window-cli/*.mjs
      # TUI 专项暂停自动验收；上游完善并重新验收接入后再恢复，手动入口仍保留。
      # 这里只跑手机纯逻辑单测；需要手机和 UI 依赖的 Markdown 测试在下面的 mobile 作业执行
      - if: matrix.suite == 'platform'
        id: stage-21
        run: npm run mobile:test
      - if: matrix.suite == 'platform'
        id: stage-22
        run: npm run test:local-ssh
      - if: matrix.suite == 'platform'
        id: stage-23
        run: npm run docs:build
      # 独立发布包：安装脚本和包里的入口做静态检查；出一个本机平台的包，装进临时的主目录，确认装上的命令报得出版本。
      # Linux 上再把完整的容器验证跑一遍（发版的流程里验的是要发的那一份，这里先拦住平时的改动把它弄坏）
      - name: 安装脚本的静态检查
        id: phase-4
        if: matrix.suite == 'platform'
        run: |
          sh -n scripts/install.sh
          sh -n scripts/adapter-launcher.sh
          node --test scripts/install-disk-space.test.mjs scripts/remote-upgrade-disk.test.mjs
      - name: shellcheck
        id: phase-3
        if: runner.os == 'Linux' && matrix.suite == 'platform'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends shellcheck=0.9.0-1
          shellcheck --shell=sh scripts/install.sh scripts/adapter-launcher.sh
      - name: 出本机平台的发布包并试装
        id: phase-2
        timeout-minutes: 10
        if: matrix.suite == 'platform'
        run: |
          node scripts/package-adapter.mjs --target host --out "${RUNNER_TEMP}/release"
          HOME="${RUNNER_TEMP}/home" sh "${RUNNER_TEMP}/release/install.sh" --from "${RUNNER_TEMP}"/release/codex-harness-adapter-*.tar.gz
          "${RUNNER_TEMP}/home/.local/bin/codex-harness-adapter" version
      - name: 发布包的容器验证
        id: phase-1
        if: runner.os == 'Linux' && matrix.suite == 'platform'
        run: node scripts/check-adapter-package.mjs

      - name: 缓存与首次失败
        id: stage-28
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  # Mac适配器完整测试已纳入native证明，这里只为原有领域汇总保留依赖边。
  adapters-macos:
    needs: [source, native]
    if: ${{ !inputs.domains || contains(fromJSON(inputs.domains), 'adapters') }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Mac适配器完整集合已由native统一执行并出具证明'


  computer-use-windows:
    needs: source
    if: ${{ !inputs.domains || contains(fromJSON(inputs.domains), 'computer-use-windows') }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-electron
        with:
          # 安装器用 electron_config_cache；packager 用 @electron/get 的平台默认目录。
          path: |
            ${{ github.workspace }}/.artifacts/electron-cache
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-v2-${{ runner.os }}-${{ runner.arch }}-node24.21.0-${{ hashFiles('apps/desktop/package-lock.json') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-3
        with:
          node-version: 24.21.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-5
        with:
          go-version: 1.26.10
      # 工具链的版本只在 rust-toolchain.toml 里写，rustup 在 crate 目录里按它装、按它用
      - name: Rust 工具链（apps/computer-use-win/rust-toolchain.toml）
        id: phase-16
        working-directory: apps/computer-use-win
        run: |
          rustup set auto-self-update disable
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
      - name: Cargo 工具链指纹
        id: rust
        working-directory: apps/computer-use-win
        run: echo "fingerprint=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-cargo
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            apps/computer-use-win/target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('apps/computer-use-win/Cargo.lock', 'apps/computer-use-win/rust-toolchain.toml') }}-${{ needs.source.outputs.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('apps/computer-use-win/Cargo.lock', 'apps/computer-use-win/rust-toolchain.toml') }}-
      - name: 助手的单元测试
        id: phase-15
        working-directory: apps/computer-use-win
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: 构建助手
        id: phase-14
        working-directory: apps/computer-use-win
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Inno Setup 6.7.1
        id: phase-13
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - run: npm ci --no-audit --no-fund
        id: phase-12
      - run: npm ci --prefix packages/claude --no-audit --no-fund
        id: phase-11
      - run: npm ci --prefix packages/pi --no-audit --no-fund
        id: phase-10
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
        id: phase-9
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
        id: phase-8
      - run: npm ci --prefix packages/acp --no-audit --no-fund
        id: phase-7
      - run: npm run build
        id: phase-6
      - run: npm run client:setup
        id: phase-5
      - run: node apps/desktop/scripts/check-computer-use.mjs --require
        id: phase-4
      - run: npm run client:pack
        id: phase-3
      - run: node apps/desktop/scripts/make-installer.mjs
        id: phase-2
      - name: 助手装进了应用
        id: phase-1
        run: test -f apps/desktop/out/Litch-win32-x64/resources/computer-use/litch-computer-use.exe

      - name: 缓存与首次失败
        id: stage-24
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  # 客户端：核心的单元测试、三个包的类型检查、界面构建，再起真的 Electron 做自检、对话区的滚动验收、输入区的验收、终端面板的验收和远程设备的验收（窗口不显示）。
  # 代码规范检查由上面 adapters 里的 npm run check 一并覆盖。
  dsh:
    needs: source
    if: ${{ !inputs.domains || contains(fromJSON(inputs.domains), 'dsh') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-4
        with:
          go-version: 1.26.10
      - name: Linux沙箱前置（与双平台对照一致）
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
      - run: npm ci --no-audit --no-fund
        id: phase-5
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
        id: phase-4
      - name: 安装隔离的 dsh
        id: phase-3
        run: |
          version="$(node -p "require('./protocol/versions.json').dshMinimum")"
          npm install --prefix .artifacts/host-dsh --save-exact "@deepseek-ai/dsh@${version}" --no-audit --no-fund
          echo "CHA_DSH_CLI=${GITHUB_WORKSPACE}/.artifacts/host-dsh/node_modules/.bin/dsh" >> "${GITHUB_ENV}"
      # 含 dsh 入口的协议兼容性测试（packages/dsh/test/upstream-compat.test.mts）
      - run: npm run test:dsh
        id: phase-2
      - run: npm run test:dsh-ssh
        id: phase-1

      - name: 缓存与首次失败
        id: stage-10
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  # OpenCode 本体不随适配器分发，测试要一份真实的 opencode：按 protocol/versions.json 登记的验证过的版本
  # （opencodeVerified 的第一个）装到临时前缀。模型端是回环上的假模型，数据目录按 HOME/XDG 隔离在临时目录里。
  opencode:
    needs: source
    if: ${{ !inputs.domains || contains(fromJSON(inputs.domains), 'opencode') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-4
        with:
          go-version: 1.26.10
      - name: Linux沙箱前置（与双平台对照一致）
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
      - run: npm ci --no-audit --no-fund
        id: phase-4
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
        id: phase-3
      - name: 安装隔离的 opencode
        id: phase-2
        run: |
          version="$(node -p "require('./protocol/versions.json').opencodeVerified[0]")"
          npm install --prefix .artifacts/host-opencode --save-exact "opencode-ai@${version}" --no-audit --no-fund
          echo "CHA_OPENCODE_CLI=${GITHUB_WORKSPACE}/.artifacts/host-opencode/node_modules/.bin/opencode" >> "${GITHUB_ENV}"
      - run: npm run test:opencode
        id: phase-1

      - name: 缓存与首次失败
        id: stage-9
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  # 客户端对着三个引擎各走一遍的验收：真的适配器主进程管着 Claude Code、Pi、dsh，模型请求全部走回环上的假模型，
  # 界面在不显示的窗口里把新建、审批、提问、技能、打断、读历史、计划模式、改文件与差异、图片、分叉回退压缩各走一遍。
  # Claude Code 和 dsh 的命令行不随适配器分发：各装一份隔离的到临时前缀（版本和上面两个 job 的一样），
  # 缺哪一个这一步都会直接失败，不会跳过。单独一个 job：它要的依赖比 client 多（引擎包都要装、都要构建；
  # OpenCode 和 ACP 的两个包也在里面，只因为 npm run build 要构建它们，验收还不走这两个引擎）
  real-engines:
    needs: [source, gate]
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') && (!inputs.domains || contains(fromJSON(inputs.domains), 'real-engines')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/linux-desktop.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      suites: ${{ toJSON(inputs.run-ci) == 'false' && '["real-engines"]' || '["real-engine-tools"]' }}
      identity: real-engines

  mobile-build:
    needs: source
    if: ${{ !inputs.domains || contains(fromJSON(inputs.domains), 'mobile') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.apk.outputs.sha }}
      hash: ${{ steps.apk.outputs.hash }}
      artifact-id: ${{ steps.apk-upload.outputs.artifact-id }}
    steps:
      - name: 为原生构建与缓存腾出空间
        id: stage-1
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/node_modules
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-2
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-3
        with:
          node-version: 24.21.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-5
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: |
            go.sum
            mobile/go.sum
      - name: 手机 Go 公共层测试
        working-directory: mobile
        run: go test ./...
      - name: 构建目录与 JDK 17
        id: phase-8
        run: |
          mkdir -p "${RUNNER_TEMP}/metro-tmp" "${RUNNER_TEMP}/gradle"
          echo "TMPDIR=${RUNNER_TEMP}/metro-tmp" >> "${GITHUB_ENV}"
          echo "GRADLE_USER_HOME=${RUNNER_TEMP}/gradle" >> "${GITHUB_ENV}"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
      - run: npm ci --no-audit --no-fund
        id: phase-7
      - run: npm ci --prefix apps/mobile --no-audit --no-fund
        id: phase-6
      - run: npm ci --prefix packages/ui --no-audit --no-fund
        id: phase-5
      - run: npm run mobile:test
        id: phase-4
      - name: 手机类型检查
        run: npm run typecheck --prefix apps/mobile
      - name: 手机原生 Markdown 与 WASM 中文强调对照
        id: phase-3
        run: npm run mobile:test:markdown
      - name: 生成 Android 工程
        id: phase-2
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_LITCH_E2E: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Android 工具链指纹
        id: android-tools
        run: |
          fingerprint="$("${JAVA_HOME}/bin/java" -version 2>&1 | sha256sum | cut -d ' ' -f 1)"
          echo "jdk=${fingerprint}" >> "${GITHUB_OUTPUT}"
      # prebuild 会清 android，只缓存用户级依赖和 Gradle build-cache，不把签名/APK 当缓存。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-gradle
        with:
          path: |
            ${{ runner.temp }}/gradle/caches
            ${{ runner.temp }}/gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-x86_64-node24.21.0-go${{ hashFiles('mobile/go.mod') }}-jdk${{ steps.android-tools.outputs.jdk }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/*.gradle', 'apps/mobile/android/gradle.properties', 'apps/mobile/node_modules/react-native/gradle/libs.versions.toml', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'mobile/**') }}-${{ needs.source.outputs.sha }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-${{ runner.arch }}-x86_64-node24.21.0-go${{ hashFiles('mobile/go.mod') }}-jdk${{ steps.android-tools.outputs.jdk }}-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/*.gradle', 'apps/mobile/android/gradle.properties', 'apps/mobile/node_modules/react-native/gradle/libs.versions.toml', 'apps/mobile/plugins/**', 'apps/mobile/modules/**', 'mobile/**') }}-
      # Expo 在 CI 下不执行 RN 传来的 --reset-cache；Metro 自身按源码内容失效转换结果。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-metro
        with:
          path: |
            ${{ runner.temp }}/metro-tmp/metro-cache
            ${{ runner.temp }}/metro-tmp/metro-file-map-*
          key: metro-v1-${{ runner.os }}-${{ runner.arch }}-x86_64-node24.21.0-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/metro.*', 'apps/mobile/babel.config.js', 'apps/mobile/patches/**') }}-${{ needs.source.outputs.sha }}
          restore-keys: |
            metro-v1-${{ runner.os }}-${{ runner.arch }}-x86_64-node24.21.0-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/metro.*', 'apps/mobile/babel.config.js', 'apps/mobile/patches/**') }}-
      - name: 打 release 包
        id: phase-1
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_LITCH_E2E: '1'
        run: npm run android:release -- --build-cache --max-workers=4 -PreactNativeArchitectures=x86_64
      - name: 封存唯一 APK
        id: apk
        run: node scripts/ci/apk.mjs seal "${RUNNER_TEMP}/mobile-apk" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: 校验 APK 签名、Android manifest 与封存清单
        run: |
          node scripts/ci/check-mobile-apk.mjs "${RUNNER_TEMP}/mobile-apk/app-release.apk"
          node scripts/ci/apk.mjs verify "${RUNNER_TEMP}/mobile-apk"
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.apk.outputs.sha }}
          EXPECTED_APK_HASH: ${{ steps.apk.outputs.hash }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: apk-upload
        with:
          name: mobile-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: 缓存与首次失败
        id: stage-19
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  mobile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mobile-e2e && (!inputs.domains || contains(fromJSON(inputs.domains), 'mobile')) }}
    needs: [source, mobile-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: 为模拟器 userdata 与 SDK 腾出空间
        id: prepare-disk
        run: bash scripts/ci/mobile-disk.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-npm
        with:
          path: ${{ github.workspace }}/.artifacts/npm-cache
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-node24.21.0-${{ hashFiles('package-lock.json', 'packages/*/package-lock.json', 'apps/*/package-lock.json') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: stage-4
        with:
          go-version: 1.26.10
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        id: stage-5
        with:
          artifact-ids: ${{ needs.mobile-build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/mobile-apk
      - name: 核对源码与 APK hash
        id: phase-8
        run: node scripts/ci/apk.mjs verify "${RUNNER_TEMP}/mobile-apk"
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.mobile-build.outputs.sha }}
          EXPECTED_APK_HASH: ${{ needs.mobile-build.outputs.hash }}
      - name: 模拟器 KVM 与 JDK 17
        id: phase-7
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
      - name: 装 Maestro 2.3.0
        id: phase-6
        run: |
          node scripts/ci/download.mjs maestro https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.3.0/maestro.zip "${RUNNER_TEMP}/maestro.zip"
          echo "aaf524c6bcd456013855b1337464f964d9a65e2fb88861affea9b4c014644e50  ${RUNNER_TEMP}/maestro.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/maestro.zip" -d "${RUNNER_TEMP}"
          echo "MAESTRO=${RUNNER_TEMP}/maestro/bin/maestro" >> "${GITHUB_ENV}"
      - run: npm ci --no-audit --no-fund
        id: phase-5
      - run: npm ci --prefix packages/pi --no-audit --no-fund
        id: phase-4
      - run: npm run build --prefix packages/pi && npm run build --prefix packages/device && node scripts/build-cli.mjs
        id: phase-3
      - name: 换新的 Android cmdline-tools
        id: phase-2
        run: |
          node scripts/ci/download.mjs android-tools https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip "${RUNNER_TEMP}/cmdline-tools.zip"
          unzip -q "${RUNNER_TEMP}/cmdline-tools.zip" -d "${RUNNER_TEMP}/cmdline-tools"
          rm -rf "${ANDROID_HOME:?}/cmdline-tools/latest"
          mv "${RUNNER_TEMP}/cmdline-tools/cmdline-tools" "${ANDROID_HOME:?}/cmdline-tools/latest"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
      - name: 准备 Android SDK（仅下载基础设施重试）
        id: phase-1
        timeout-minutes: 10
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # action 内部也安装这些包；先准备好，使系统镜像下载同样受有限重试与首败日志保护。
          node scripts/ci/android-sdk-install.mjs
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        id: stage-14
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # 两组实验固定为历史样本的同一模拟器 build；避免 sdkmanager 最新版漂移。
          emulator-build: '16740729'
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot${{ inputs.mobile-disable-vulkan && ' -feature -Vulkan' || '' }}
          emulator-boot-timeout: 600
          pre-emulator-launch-script: |
            node scripts/ci/android-diagnostics.mjs host
            node scripts/ci/android-health.mjs mark-start
          script: node apps/mobile/scripts/e2e.mjs --serial emulator-5554 --shard ${{ matrix.shard }}/3 --apk "${RUNNER_TEMP}/mobile-apk/app-release.apk"
        env:
          LITCH_E2E_ARTIFACTS: ${{ runner.temp }}/maestro-out
          LITCH_E2E_DIAGNOSTICS: '1'
          LITCH_E2E_BOOT_MARKER: '1'
          # 记录传输与服务生命周期以对齐并发命令；不启用 packets/rwx、不主动 kill/restart ADB。
          ADB_TRACE: transport,services
      - name: 保留 ADB 宿主传输日志
        if: always()
        run: node scripts/ci/android-diagnostics.mjs collect
        env:
          LITCH_E2E_ARTIFACTS: ${{ runner.temp }}/maestro-out
      - if: always()
        id: stage-15
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mobile-e2e-maestro-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maestro-out
          if-no-files-found: ignore
          retention-days: 7
      - name: 缓存与首次失败
        id: stage-16
        if: always()
        run: node scripts/ci/job-summary.mjs
        env:
          CI_STEPS: ${{ toJSON(steps) }}

  report:
    if: always()
    needs: [source, gate, adapters, native, client-unit, computer-use-windows, dsh, opencode, real-engines, mobile-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: stage-1
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        id: stage-2
        with:
          node-version: 24.21.0
      - run: node scripts/ci/run-summary.mjs
        id: stage-3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # 显式标明上游失败，不能把缺产物误判成一个独立的产品失败。
      - name: 阻断失败的上游
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '::error::LITCH_RECOVERY_UPSTREAM_FAILURE'
          exit 1
      - name: 读取同run成功Mac和Linux作业的不可变检查证明
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_SOURCE_SHA: ${{ needs.source.outputs.sha }}
          NATIVE_DOMAINS: ${{ needs.source.outputs.native-domains }}
          FULL_DOMAINS: ${{ inputs.domains || '' }}
          FULL_RUN_CI: ${{ toJSON(inputs.run-ci) != 'false' }}
        run: node scripts/ci/read-check-proofs.mjs
      - name: 记录输入、实际检出和完整领域结果
        run: node scripts/full-proof.mjs
        env:
          FULL_SOURCE_SHA: ${{ needs.source.outputs.sha }}
          FULL_REQUESTED_SHA: ${{ inputs.sha || '' }}
          FULL_DOMAINS: ${{ inputs.domains || '' }}
          FULL_RUN_CI: ${{ github.event_name == 'schedule' || inputs.run-ci }}
          FULL_MOBILE_DISABLE_VULKAN: ${{ inputs.mobile-disable-vulkan || false }}
          FULL_MOBILE_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.mobile-e2e && (!inputs.domains || contains(fromJSON(inputs.domains), 'mobile')) || false }}
          FULL_NEEDS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: full-proof-${{ github.run_attempt }}
          path: full-proof.json
          if-no-files-found: error
