name: Runtime artifacts
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      # 制品里带着适配器的命令行：终端用的伪终端桥是它的子命令
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.6
      - name: 沙箱依赖
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3
      - run: sh scripts/package-claude-runtime.sh . .artifacts/runtime
      - run: sh scripts/package-pi-runtime.sh . .artifacts/runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-amd64-runtimes
          path: .artifacts/runtime
          if-no-files-found: error
