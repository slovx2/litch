name: Mac Linux check comparison
# 只做同SHA对照，不签名、不出发布包、不改变Full/Gate的领域选择。
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      npm_config_cache: ${{ github.workspace }}/.artifacts/npm-cache
      CI_CHECK_REPORT: ${{ github.workspace }}/check-results/${{ matrix.os }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
      - name: Linux桌面与沙箱前置
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run
          df -h /dev/shm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash scripts/ci/install-bubblewrap.sh
      - name: 安装相同源码的依赖
        run: |
          npm ci --no-audit --no-fund
          for package in claude pi dsh opencode acp; do
            npm ci --prefix "packages/${package}" --no-audit --no-fund
          done
          npm run client:setup
      - name: 同版本隔离CLI
        run: node scripts/ci/install-test-clis.mjs desktop-required real-engine-tools dsh opencode client-engines
      - run: npm run build
      - name: 同一检查集合，不允许跳过
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a --server-args='-screen 0 1920x1080x24' node scripts/ci/run-checks.mjs desktop-portable-unit desktop-required dsh opencode real-engine-tools client-engines
          else
            node scripts/ci/run-checks.mjs desktop-portable-unit desktop-required dsh opencode real-engine-tools client-engines
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: check-comparison-${{ matrix.os }}-${{ github.run_attempt }}
          path: check-results/*.json
          if-no-files-found: warn
          retention-days: 7
  compare:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: 读取本次运行的两份检查记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "check-comparison-macos-15-${GITHUB_RUN_ATTEMPT}" -D "$RUNNER_TEMP/comparison"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "check-comparison-ubuntu-24.04-${GITHUB_RUN_ATTEMPT}" -D "$RUNNER_TEMP/comparison"
      - name: 核对来源、检查ID、实际用例和跳过数量
        run: |
          node scripts/ci/compare-checks.mjs "$RUNNER_TEMP/comparison/macos-15.json" "$RUNNER_TEMP/comparison/ubuntu-24.04.json" desktop-portable-unit desktop-required dsh opencode real-engine-tools client-engines
