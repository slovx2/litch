name: Recovery fixture reusable child
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 下游真实执行
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo '同SHA可复用workflow下游已执行'
