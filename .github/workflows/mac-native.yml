name: Consolidated Mac native checks
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      domains:
        type: string
        required: true
      after-signing:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
env:
  npm_config_cache: ${{ github.workspace }}/.artifacts/npm-cache
  electron_config_cache: ${{ github.workspace }}/.artifacts/electron-cache
jobs:
  priority:
    uses: ./.github/workflows/mac-priority.yml
    with:
      sha: ${{ inputs.sha }}
      after-signing: ${{ inputs.after-signing }}
  route:
    needs: priority
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      local: ${{ steps.route.outputs.local }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - id: route
        run: node scripts/ci/local-mac-route.mjs route
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          NATIVE_DOMAINS: ${{ inputs.domains }}
          LITCH_LOCAL_MAC_PUBLIC_KEY: ${{ vars.LITCH_LOCAL_MAC_PUBLIC_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-native-request-${{ github.run_attempt }}
          path: mac-native-request.json
          if-no-files-found: error
          retention-days: 14
  checks:
    needs: route
    runs-on: ${{ needs.route.outputs.runner }}
    timeout-minutes: 150
    env:
      NATIVE_DOMAINS: ${{ inputs.domains }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: 核验本地签名、同SHA、完整集合与原始容量失败
        if: needs.route.outputs.local == 'true'
        run: node scripts/ci/local-mac-route.mjs import
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.sha }}
          LITCH_LOCAL_MAC_PUBLIC_KEY: ${{ vars.LITCH_LOCAL_MAC_PUBLIC_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: needs.route.outputs.local != 'true'
        with:
          go-version: 1.26.10
      - uses: ruby/setup-ruby@efbf473cab83af4468e8606cc33eca9281bb213f
        if: needs.route.outputs.local != 'true' && contains(fromJSON(inputs.domains), 'ios')
        with:
          ruby-version: 3.4.7
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: needs.route.outputs.local != 'true'
        with:
          path: |
            ${{ github.workspace }}/.artifacts/npm-cache
            ${{ github.workspace }}/.artifacts/electron-cache
          key: mac-native-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}
      - name: 同一套准备与完整Mac检查，不重试
        if: needs.route.outputs.local != 'true'
        env:
          LITCH_PROJECTIONS_OUTPUT: ${{ runner.temp }}/sidebar-projections
        run: node scripts/ci/prepare-mac-native.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mac-native-proof-${{ github.run_attempt }}
          path: mac-native-proof.json
          if-no-files-found: error
          retention-days: 14
      - name: 保存侧栏投影失败现场
        if: failure() && needs.route.outputs.local != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sidebar-projections-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sidebar-projections
          if-no-files-found: warn
          retention-days: 7
