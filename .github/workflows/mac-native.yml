name: Consolidated Mac native checks
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      domains:
        type: string
        required: true
      after-signing:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
env:
  npm_config_cache: ${{ github.workspace }}/.artifacts/npm-cache
  electron_config_cache: ${{ github.workspace }}/.artifacts/electron-cache
jobs:
  priority:
    uses: ./.github/workflows/mac-priority.yml
    with:
      sha: ${{ inputs.sha }}
      after-signing: ${{ inputs.after-signing }}
  checks:
    needs: priority
    runs-on: macos-15
    timeout-minutes: 150
    env:
      NATIVE_DOMAINS: ${{ inputs.domains }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        if: contains(fromJSON(inputs.domains), 'ios')
        with:
          ruby-version: 3.4.7
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ github.workspace }}/.artifacts/npm-cache
            ${{ github.workspace }}/.artifacts/electron-cache
          key: mac-native-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}
      - name: 同一套准备与完整Mac检查，不重试
        run: node scripts/ci/prepare-mac-native.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mac-native-proof-${{ github.run_attempt }}
          path: mac-native-proof.json
          if-no-files-found: error
          retention-days: 14
