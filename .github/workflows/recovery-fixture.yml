name: Recovery Linux fixture
run-name: Recovery fixture ${{ inputs.case }}
on:
  workflow_dispatch:
    inputs:
      case:
        description: 合成准备故障或产品故障，不使用真实模型/签名
        type: choice
        options: [infra, product, mixed, multi]
        default: infra
permissions:
  contents: read
jobs:
  infra-a:
    if: inputs.case != 'product'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 恢复演练：模拟准备下载
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
            echo '::error::HTTP 503 LITCH_FIXTURE_INFRA'
            exit 1
          fi
          echo '合成准备故障已恢复；产品断言未被修改'
  infra-b:
    if: inputs.case == 'multi'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 恢复演练：模拟准备下载
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
            echo '::error::HTTP 503 LITCH_FIXTURE_INFRA'
            exit 1
          fi
          echo '第二片准备完成'
  product:
    if: inputs.case == 'product' || inputs.case == 'mixed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: 合成产品断言（禁止重试）
        run: node -e 'require("node:assert/strict").equal("actual", "expected")'
  preserved:
    runs-on: ubuntu-24.04
    steps:
      - run: printf '%s\n' "$GITHUB_SHA/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > preserved.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovery-fixture-preserved
          path: preserved.txt
          if-no-files-found: error
          retention-days: 14
  downstream:
    needs: [infra-a, infra-b, product]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    uses: ./.github/workflows/recovery-fixture-child.yml
  report:
    needs: [infra-a, infra-b, product, preserved, downstream]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 阻断失败的上游
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '::error::LITCH_RECOVERY_UPSTREAM_FAILURE'
          exit 1
      - run: echo '合成下游汇总通过'
