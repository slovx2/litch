name: Windows native
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        type: string
        default: ''
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix packages/claude --no-audit --no-fund
      - run: npm ci --prefix packages/pi --no-audit --no-fund
      - run: npm ci --prefix packages/dsh --no-audit --no-fund
      - run: npm ci --prefix packages/opencode --no-audit --no-fund
      - run: npm ci --prefix packages/acp --no-audit --no-fund
      - name: 隔离的官方 CLI 与 Git Bash
        run: |
          npm install --prefix .artifacts/host-cli --save-exact @anthropic-ai/claude-code@2.1.282 --no-audit --no-fund
          "CHA_CLAUDE_CLI=$env:GITHUB_WORKSPACE/.artifacts/host-cli/node_modules/@anthropic-ai/claude-code/bin/claude.exe" >> $env:GITHUB_ENV
          "CLAUDE_CODE_GIT_BASH_PATH=C:\Program Files\Git\bin\bash.exe" >> $env:GITHUB_ENV
      - run: npm run typecheck
      - name: 上游镜像按原始字节检出
        run: node --test scripts/magpie-checkout.test.mjs
      - run: npm run build
      - run: npm run build --prefix packages/core
      - name: Windows 本机文件与进程原生用例（不允许跳过）
        run: node scripts/ci/run-checks.mjs windows-native --built
        env:
          CI_CHECK_REPORT: .artifacts/windows-native-checks/checks.json
      - name: 上传 Windows 原生检查证明
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-proof-${{ github.run_attempt }}
          path: .artifacts/windows-native-checks/checks.json
          if-no-files-found: error
          retention-days: 14
      - name: 路径、权限和存储边界
        run: |
          node --test packages/claude/dist/claude/test/platform-path.test.mjs packages/claude/dist/claude/test/sandbox-dependencies.test.mjs
          node --test packages/pi/dist/pi/test/store-format.test.mjs
      - run: go test -v -timeout=2m ./...
      - run: npm run test:local-ssh
