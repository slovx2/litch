<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Litch M0 Electron fixture</title>
<style>
body { padding:16px; font:16px system-ui; background:#fafafa; color:#222 }
textarea { display:block; width:540px; height:100px; font:20px system-ui }
button { margin:12px 0; width:160px; height:35px }
#scroll { height:160px; overflow:auto; border:1px solid #777 }
</style>
<h3>后台 Electron 目标（无网络、无用户数据）</h3>
<textarea id="text" aria-label="probe-text"></textarea>
<button id="button">计数按钮</button>
<div id="scroll"></div>
<script>
const text = document.querySelector('#text'), button = document.querySelector('#button'),
  scroll = document.querySelector('#scroll')
scroll.innerText = Array.from({length:100}, (_,i) => `滚动行 ${i+1} · background input probe`).join('\n')
let clicks = 0, events = []
button.onclick = () => clicks++
for (const type of ['keydown','keyup','input','mousedown','mouseup','click','wheel']) {
  document.addEventListener(type, e => {
    events.push({ type, key:e.key ?? '', data:e.data ?? '', target:e.target.id,
      trusted:e.isTrusted, time:performance.now() })
    if (events.length > 200) events.shift()
  }, true)
}
function report() {
  const points = Object.fromEntries([['text',text],['button',button],['scroll',scroll]].map(([id,el]) => {
    const r=el.getBoundingClientRect(); return [id,{x:r.x+r.width/2,y:r.y+r.height/2}]
  }))
  window.fixture.report({text:text.value,clicks,scrollY:scroll.scrollTop,events,points,
    documentFocus:document.hasFocus(), focusedElement:document.activeElement?.id, dpr:devicePixelRatio})
}
window.fixture.onCommand(action => {
  if (action === 'reset') { text.value=''; clicks=0; events=[]; scroll.scrollTop=0 }
  if (action === 'focusText') text.focus()
  report()
})
text.focus()
setInterval(report,50)
</script>
