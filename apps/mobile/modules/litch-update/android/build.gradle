plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.litch'
version = '0.0.0'

// FileProvider、PackageInfoCompat 来自 androidx.core，expo-modules-core 已经以 api 带上，这里不另加依赖
android {
  namespace 'dev.litch.update'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.0.0'
  }
}
