# 模拟核心：建议任务。新建会话说“提个子会话”→ 对话里三张提案卡、顶上“几个建议任务等你开始”→ 第一张点“不要”→
# 第二张过一会儿过期 → 第三张（Pi，沙箱收不紧）“改了再开始”：改标题、关掉完成后唤醒、开始 → 回到对话，卡片下面是起出来的子会话 →
# 菜单里的“建议任务”列表：三条都了结了，点一条回到对话里那张卡
appId: dev.litch.app
name: mock-建议任务
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      READY: device:local
- tapOn:
    id: device:local
- tapOn:
    id: sessions:new
- extendedWaitUntil:
    visible:
      id: new-input
    timeout: 15000
- tapOn:
    id: new-input
- inputText: propose a sub-session
- tapOn:
    id: new-send
- extendedWaitUntil:
    visible:
      id: detail:proposals
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: proposal:.*:start
    timeout: 10000
# 第一张带着背景、比较高，回答停下时它的“不要”可能已经滚到屏幕上面去了：先翻回到它，免得点成下面那张
- scrollUntilVisible:
    element:
      text: (Tidy the CHANGELOG|整理 CHANGELOG)
    direction: UP
    centerElement: true
    timeout: 10000
# 四个按钮在窄屏上折成两行，“不要”在第二行，可能被输入框挡着：往下翻到它露出来
- scrollUntilVisible:
    element:
      id: proposal:.*:dismiss
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: proposal:.*:dismiss
    index: 0
# 那张卡片在屏幕上面一截：往回翻到看得见它的状态
- scrollUntilVisible:
    element:
      text: (Dismissed|已忽略)
    direction: UP
    timeout: 10000
# 第二张八秒后过期（模拟核心里特意定得短）
- extendedWaitUntil:
    visible:
      text: (Expired|已过期)
    timeout: 20000
- scrollUntilVisible:
    element:
      id: proposal:.*:edit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: proposal:.*:edit
- extendedWaitUntil:
    visible:
      id: proposal-start
    timeout: 10000
- assertVisible:
    id: proposal-start:wider
# 页面比一屏长（多了背景一栏），标题和唤醒开关在下面
- scrollUntilVisible:
    element:
      id: proposal-start:title
    direction: DOWN
    timeout: 10000
- tapOn:
    id: proposal-start:title
- eraseText: 80
- inputText: e2e edited
- hideKeyboard
- scrollUntilVisible:
    element:
      id: proposal-start:wake
    direction: DOWN
    timeout: 10000
- tapOn:
    id: proposal-start:wake
- scrollUntilVisible:
    element:
      id: proposal-start:go
    direction: DOWN
- tapOn:
    id: proposal-start:go
# 起出来的子会话那一行在卡片下面，窄屏上可能在屏幕外
- scrollUntilVisible:
    element:
      id: proposal:.*:child
    direction: DOWN
    timeout: 15000
- assertNotVisible:
    id: detail:proposals
- tapOn:
    id: detail:menu
- tapOn:
    id: detail:menu:proposals
- extendedWaitUntil:
    visible:
      id: proposals
    timeout: 10000
- assertVisible:
    text: .*(Settled \(3\)|已处理（3）).*
- tapOn:
    id: proposals:reveal:.*
    index: 0
- extendedWaitUntil:
    visible:
      id: detail
    timeout: 10000
