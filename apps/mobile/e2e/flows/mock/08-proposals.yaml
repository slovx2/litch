# 模拟核心：建议任务。新建会话说“提个子会话”→ 对话里三张提案卡、顶上“几个建议任务等你开始”→ 第一张“⋯”里点“忽略”→
# 第二张过一会儿过期 → 第三张（Pi，沙箱收不紧）“⋯”里“编辑后开始”：改标题、关掉完成后唤醒、开始 → 回到对话，卡片下面是起出来的子会话 →
# 菜单里的“建议任务”列表：三条都了结了，点一条回到对话里那张卡
appId: dev.litch.app
name: mock-建议任务
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      CONTROLLED: "1"
      READY: device:local
- tapOn:
    id: device:local
- tapOn:
    id: sessions:new
- extendedWaitUntil:
    visible:
      id: new-input
    timeout: 15000
- tapOn:
    id: new-input
- inputText: propose a sub-session
- tapOn:
    id: new-send
- extendedWaitUntil:
    visible:
      id: detail:proposals
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: proposal:.*:start
    timeout: 10000
# iOS 的倒置列表会把视口外的卡片也报告为可见；先用手势翻回开头。
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 2
          commands:
            - swipe:
                start: 50%, 35%
                end: 50%, 75%
                duration: 500
# 三张卡排在提出它们的位置（回答上面），第一张带着背景、比较高，回答写完时列表贴着底，它可能在屏幕上面：
# 先翻回到它，免得点成下面那张；第一张紧挨着列表开头，不强行居中。
- scrollUntilVisible:
    element:
      text: (Tidy the CHANGELOG|整理 CHANGELOG)
    direction: UP
    timeout: 10000
# 卡上只有“开始”“在这里做”，“忽略”在卡片右上角的“⋯”里：点标题上方最近的那个“⋯”
- scrollUntilVisible:
    element:
      id: proposal:e2e-pr1:more
    direction: UP
    timeout: 10000
- tapOn:
    id: proposal:e2e-pr1:more
- tapOn:
    id: proposal:e2e-pr1:dismiss
# 那张卡片在屏幕上面一截：往回翻到看得见它的状态
- scrollUntilVisible:
    element:
      text: (Dismissed|已忽略)
    direction: UP
    timeout: 10000
# 显式释放第二张提案的过期计时。
- openLink: litch://test-clock?ms=8000
- extendedWaitUntil:
    visible:
      text: (Expired|已过期)
    timeout: 20000
# “编辑后开始”也在“⋯”里：Pi 那张卡标题上方的“⋯”
- scrollUntilVisible:
    element:
      id: proposal:e2e-pr3:more
    centerElement: true
    direction: DOWN
    timeout: 10000
- tapOn:
    id: proposal:e2e-pr3:more
- tapOn:
    id: proposal:e2e-pr3:edit
- extendedWaitUntil:
    visible:
      id: proposal-start
    timeout: 10000
- assertVisible:
    id: proposal-start:wider
# Pi 不能继承父会话的项目权限：先保留警告断言，再返回明确提升父会话权限。
- tapOn:
    id: header:back
- runFlow: ../_shared/full-access.yaml
- scrollUntilVisible:
    element:
      id: proposal:e2e-pr3:more
    centerElement: true
    direction: UP
    timeout: 10000
- tapOn:
    id: proposal:e2e-pr3:more
- tapOn:
    id: proposal:e2e-pr3:edit
- extendedWaitUntil:
    visible:
      id: proposal-start
    timeout: 10000
- assertNotVisible:
    id: proposal-start:wider
# 页面比一屏长（多了背景一栏），标题和唤醒开关在下面
- scrollUntilVisible:
    element:
      id: proposal-start:title
    centerElement: true
    direction: DOWN
    timeout: 10000
- tapOn:
    id: proposal-start:title
- eraseText: 80
- inputText: e2e edited
- runFlow: ../_shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: proposal-start:wake
    direction: DOWN
    timeout: 10000
- tapOn:
    id: proposal-start:wake
- scrollUntilVisible:
    element:
      id: proposal-start:title
    centerElement: true
    direction: UP
- tapOn:
    id: proposal-start:title
- assertVisible:
    id: proposal-start:go
- tapOn:
    id: proposal-start:go
# 起出来的子会话那一行在卡片下面，窄屏上可能在屏幕外
- scrollUntilVisible:
    element:
      id: proposal:e2e-pr3:child
    direction: DOWN
    timeout: 15000
- assertNotVisible:
    id: detail:proposals
- tapOn:
    id: detail:menu
- tapOn:
    id: detail:menu:proposals
- extendedWaitUntil:
    visible:
      id: proposals
    timeout: 10000
- assertVisible:
    text: .*(Settled \(3\)|已处理（3）).*
- tapOn:
    id: proposals:reveal:.*
    index: 0
- extendedWaitUntil:
    visible:
      id: detail
    timeout: 10000
