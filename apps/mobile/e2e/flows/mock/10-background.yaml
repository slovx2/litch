appId: dev.litch.app
name: mock-后台任务
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      CONTROLLED: "1"
      READY: device:local
- tapOn:
    id: device:local
- tapOn:
    id: sessions:new
- extendedWaitUntil:
    visible:
      id: new-input
    timeout: 15000
- tapOn:
    id: new-input
- inputText: start two background tasks
- tapOn:
    id: new-send
- extendedWaitUntil:
    visible:
      id: background:bar
    timeout: 20000
# 状态只在测试推进时钟后改变，运行态覆盖不再是可选分支。
- tapOn:
    id: background:bar
- extendedWaitUntil:
    visible:
      id: background
    timeout: 5000
- assertVisible:
    id: "background:entry:task:.*"
- tapOn:
    id: header:back
- assertVisible:
    id: process-head
    text: ".*2 (running in the background|个在后台运行).*"
- openLink: litch://test-clock?ms=4000
- extendedWaitUntil:
    visible:
      id: turn-origin:backgroundTask
    timeout: 15000
- assertVisible:
    id: background:bar
- openLink: litch://test-clock?ms=5000
- extendedWaitUntil:
    notVisible:
      id: background:bar
    timeout: 20000
- assertNotVisible:
    id: process-head
    text: ".*(running in the background|个在后台运行).*"
# 派子代理：回合说完以后从菜单进后台任务页，子代理和命令在同一张里
- tapOn:
    id: composer-input
- inputText: use sub-agents
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible:
      text: ".*Hubble.*"
    timeout: 20000
- tapOn:
    id: detail:menu
- tapOn:
    id: detail:menu:background
- extendedWaitUntil:
    visible:
      id: "background:entry:agent:.*"
    timeout: 5000
- assertVisible:
    id: "background:entry:task:.*"
- tapOn:
    id: background:entry:agent:completed
- extendedWaitUntil:
    visible:
      id: agent:head
    timeout: 10000
- assertVisible:
    id: agent:state
    text: ".*(Done|完成).*"
- tapOn:
    id: header:back
- extendedWaitUntil:
    visible:
      id: background
    timeout: 5000
- tapOn:
    id: header:back
