# 模拟核心：计划模式。Claude Code 写完计划自己问要不要执行（提问卡片，选“执行”就交）；
# 只有 codex 的设备上 codex 写完就结束，由界面来问（计划卡片，点“执行”开始新的回合）
appId: dev.litch.app
name: mock-计划卡片
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      READY: device:local
- tapOn:
    id: device:local
- tapOn:
    id: sessions:new
- extendedWaitUntil:
    visible:
      id: settings:plan
    timeout: 15000
- tapOn:
    id: settings:plan
- tapOn:
    id: new-input
- inputText: plan it
- tapOn:
    id: new-send
- extendedWaitUntil:
    visible:
      id: request:question
    timeout: 30000
- tapOn:
    id: request:pick:0
- extendedWaitUntil:
    notVisible:
      id: request:question
    timeout: 10000
# 选了执行，回合接着走完（计划那个回合一直在跑，之前没有“⋯”）：状态行上出现“⋯”。往下滚着找：回答比一屏长时（CI 的 320×640 上就是），答完卡片之后对话区不再贴底，
# 状态行在屏幕下面（产品问题，见 e2e/README.md）
- scrollUntilVisible:
    element:
      id: turn-menu
    direction: DOWN
    timeout: 60000
# codex 那一条
- tapOn:
    id: header:back
- tapOn:
    id: header:back
- tapOn:
    id: device:nas
- tapOn:
    id: sessions:new
- extendedWaitUntil:
    visible:
      id: settings:plan
    timeout: 15000
- tapOn:
    id: settings:plan
- tapOn:
    id: new-input
- inputText: plan it
- tapOn:
    id: new-send
- extendedWaitUntil:
    visible:
      id: request:plan
    timeout: 30000
- tapOn:
    id: plan:implement
- extendedWaitUntil:
    notVisible:
      id: request:plan
    timeout: 10000
# 执行计划是一个新的回合，收到回答（计划那个回合里只有计划，没有这句）；同上，往下滚着找
- scrollUntilVisible:
    element:
      text: .*(mock core answering|模拟核心的回答).*
    direction: DOWN
    timeout: 60000
