# 模拟核心：harness 详情设置。设备详情里 Claude Code 的“详情设置” → 配置：改强度、保存 →
# 离开前问：再改不存，切标签时问、取消留在原地，返回时问、放弃回到设备详情 →
# 账号：Anthropic 账号走 Console 粘贴授权码登录 → API key 供应商填密钥 → 网关从 provider 拉取型号、勾选写回、保存 →
# MCP、指令文件只能看（要重启的提示由 09-model-list 在 Codex 上走）
appId: dev.litch.app
name: mock-harness 详情设置
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      READY: device:local
- extendedWaitUntil:
    visible:
      id: device:local:more
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: device:local:more
- tapOn:
    id: menu:detail
- scrollUntilVisible:
    element:
      id: harness:claude:settings
- tapOn:
    id: harness:claude:settings
# 配置：强度改成高，底下出“保存”，存完说一句
- extendedWaitUntil:
    visible:
      id: hc:tab:config
    timeout: 15000
- tapOn:
    id: hc:key:effortLevel:high
- tapOn:
    id: hc:save
- extendedWaitUntil:
    visible:
      id: hc:config:said
    timeout: 10000
# 离开前问：再改一次不存，切到账号时问；取消留在原地，改动还在
- extendedWaitUntil:
    notVisible:
      id: hc:save
    timeout: 10000
- tapOn:
    id: hc:key:effortLevel:low
- tapOn:
    id: hc:tab:accounts:pick
- extendedWaitUntil:
    visible:
      id: hc:leave
    timeout: 5000
- tapOn:
    id: hc:leave:cancel
- assertVisible:
    id: hc:save
# 返回时也问；放弃就回到设备详情，再进来改动没了
- tapOn:
    id: header:back
- extendedWaitUntil:
    visible:
      id: hc:leave
    timeout: 5000
- tapOn:
    id: hc:leave:discard
- scrollUntilVisible:
    element:
      id: harness:claude:settings
    timeout: 10000
- tapOn:
    id: harness:claude:settings
- extendedWaitUntil:
    visible:
      id: hc:tab:config
    timeout: 15000
- assertNotVisible:
    id: hc:save
# 账号：Anthropic 账号用 Console 粘贴授权码登录
- tapOn:
    id: hc:tab:accounts:pick
# 账号页的 provider 是异步取来的：先等第一张卡片出来再滚，免得取到之前就往下滚过了头
- extendedWaitUntil:
    visible:
      id: hc:provider:anthropic:auth
    timeout: 10000
- scrollUntilVisible:
    element:
      id: hc:provider:anthropic:method:console
    timeout: 10000
- tapOn:
    id: hc:provider:anthropic:method:console
# 登录那一块出在卡片底下，屏幕小的模拟器上（流水线用的默认机型）要滚下去才看得见
- scrollUntilVisible:
    element:
      id: hc:attempt:.*:code
    timeout: 10000
- tapOn:
    id: hc:attempt:.*:code
- inputText: abc#def
- hideKeyboard
- scrollUntilVisible:
    element:
      id: hc:attempt:.*:send
- tapOn:
    id: hc:attempt:.*:send
- scrollUntilVisible:
    element:
      id: hc:attempt:.*:done
    timeout: 10000
# API key 供应商“工作”：填上密钥，卡片上显示末四位
- scrollUntilVisible:
    element:
      id: hc:provider:work:method:apiKey
    timeout: 10000
- tapOn:
    id: hc:provider:work:method:apiKey
- scrollUntilVisible:
    element:
      id: hc:provider:work:form:apiKey
    timeout: 10000
- tapOn:
    id: hc:provider:work:form:apiKey
- inputText: sk-e2e-1234
- hideKeyboard
- scrollUntilVisible:
    element:
      id: hc:provider:work:form:submit
- tapOn:
    id: hc:provider:work:form:submit
- scrollUntilVisible:
    element:
      id: hc:provider:work:auth
      text: .*1234.*
    timeout: 10000
# 网关 DeepSeek：编辑 → 从 provider 拉取型号 → 勾上 R2 → 写入清单 → 保存
- scrollUntilVisible:
    element:
      id: hc:provider:deepseek:edit
    direction: UP
    timeout: 10000
- tapOn:
    id: hc:provider:deepseek:edit
- scrollUntilVisible:
    element:
      id: hc:custom:discover:ask
    timeout: 10000
- tapOn:
    id: hc:custom:discover:ask
- scrollUntilVisible:
    element:
      id: hc:custom:discover:deepseek-r2
    timeout: 10000
- tapOn:
    id: hc:custom:discover:deepseek-r2
- scrollUntilVisible:
    element:
      id: hc:custom:discover:apply
- tapOn:
    id: hc:custom:discover:apply
- scrollUntilVisible:
    element:
      id: hc:custom:models
      text: .*deepseek-r2.*
    direction: UP
    timeout: 10000
- scrollUntilVisible:
    element:
      id: hc:custom:save
- tapOn:
    id: hc:custom:save
- extendedWaitUntil:
    notVisible:
      id: hc:custom
    timeout: 10000
# MCP、指令文件：只能看
- tapOn:
    id: hc:tab:mcp:pick
- scrollUntilVisible:
    element:
      id: hc:readonly
    timeout: 10000
- tapOn:
    id: hc:tab:instructions:pick
- scrollUntilVisible:
    element:
      id: hc:instr:path
    timeout: 10000
