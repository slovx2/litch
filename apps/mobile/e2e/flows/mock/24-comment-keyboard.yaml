appId: dev.litch.app
name: mock-评论输入与首次提交
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      READY: device:local
- openLink: litch://open?session=s3&device=local
- extendedWaitUntil:
    visible:
      id: answer
    timeout: 15000
- longPressOn:
    id: answer
- tapOn:
    id: menu:comment
- longPressOn:
    id: comment-picker:text
- tapOn:
    text: '^(Select All|Select all|全选)$'
- tapOn:
    id: comment-picker:add
# 评论弹层自动聚焦并移动；等动画结束后再定位，避免点到移动前的坐标。
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: comment-editor:note
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: keyboard:done
          timeout: 5000
- inputText: Keyboard comment
- assertVisible:
    id: comment-editor:note
    text: Keyboard comment
- assertVisible:
    id: comment-editor:ok
- tapOn:
    id: comment-editor:ok
- extendedWaitUntil:
    notVisible:
      id: comment-editor:note
    timeout: 10000
- assertVisible:
    id: composer-comment-1
