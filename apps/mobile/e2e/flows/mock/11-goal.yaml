appId: dev.litch.app
name: mock-持续目标
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      CONTROLLED: "1"
      READY: device:build
- openLink: litch://open?device=build&session=b6
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: /
- extendedWaitUntil:
    visible:
      id: slash:goal
    timeout: 5000
- tapOn:
    id: slash:goal
- inputText: tidy the release notes
- tapOn:
    id: composer-send
# 先完成首次数据许可并确认发送，再处理键盘；返回键不能代替同意。
- extendedWaitUntil:
    notVisible:
      id: composer-input
      text: '.*tidy the release notes'
    timeout: 10000
- runFlow: ../_shared/dismiss-keyboard.yaml
# 每次只释放一轮；等回答结束（发送键可用）再释放下一轮。
- extendedWaitUntil:
    visible:
      id: goal:status:active
    timeout: 10000
- openLink: litch://test-clock?ms=1500
- extendedWaitUntil:
    visible:
      text: '.*(Round 1:|第 1 轮).*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: composer-send
      enabled: false
    timeout: 15000
- openLink: litch://test-clock?ms=1500
- extendedWaitUntil:
    visible:
      text: '.*(Round 2:|第 2 轮).*'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: composer-send
      enabled: false
    timeout: 15000
- openLink: litch://test-clock?ms=1500
- extendedWaitUntil:
    visible:
      id: goal:reached
    timeout: 20000
- assertNotVisible:
    id: goal:bar
- assertVisible:
    text: ".*(Goal reached|目标已达成).*"
# 新目标保持 active，测试逐个确认暂停、恢复、清除。
- tapOn:
    id: composer-input
- inputText: /goal check the links again
- tapOn:
    id: composer-send
- runFlow: ../_shared/dismiss-keyboard.yaml
- extendedWaitUntil:
    visible:
      id: goal:status:active
    timeout: 10000
- tapOn:
    id: goal:pause
- extendedWaitUntil:
    visible:
      id: goal:status:paused
    timeout: 5000
- assertVisible:
    text: check the links again
- assertNotVisible:
    id: goal:reached
- extendedWaitUntil:
    visible:
      id: goal:resume
    timeout: 5000
# 暂停状态推进时钟也不能续跑。
- openLink: litch://test-clock?ms=10000
- assertVisible:
    id: goal:status:paused
- tapOn:
    id: goal:resume
- extendedWaitUntil:
    visible:
      id: goal:status:active
    timeout: 5000
- tapOn:
    id: goal:clear
- extendedWaitUntil:
    notVisible:
      id: goal:bar
    timeout: 5000
