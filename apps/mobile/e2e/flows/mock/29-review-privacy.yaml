appId: dev.litch.app
name: 启动同意后连续发送、撤回及 Tailscale 说明
tags:
  - mock
  - privacy
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      READY: device:local
- tapOn:
    id: device:local
- tapOn:
    id: sessions:new
- tapOn:
    id: new-input
- inputText: consent-e2e
- tapOn:
    id: new-send
- assertNotVisible:
    id: ai-consent:title
- extendedWaitUntil:
    visible:
      id: detail
    timeout: 20000
- assertVisible:
    id: user-message
- tapOn:
    id: composer-input
- inputText: second-consent-message
- tapOn:
    id: composer-send
- assertNotVisible:
    id: ai-consent:title
- extendedWaitUntil:
    notVisible:
      id: composer-input
      text: second-consent-message
    timeout: 15000
- runFlow: ../_shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: user-message
      text: second-consent-message
    direction: UP
    timeout: 15000
- assertVisible:
    id: user-message
    text: second-consent-message
- openLink: litch://home
- extendedWaitUntil:
    visible:
      id: devices:settings
    timeout: 10000
- tapOn:
    id: devices:settings
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: settings:withdraw-consent
          timeout: 60000
      - tapOn:
          id: settings:withdraw-consent
      - tapOn:
          id: confirm:ok
      - extendedWaitUntil:
          notVisible:
            id: confirm:ok
          timeout: 10000
      - tapOn:
          id: header:back
      - extendedWaitUntil:
          visible:
            id: devices:settings
          timeout: 10000
      - openLink: litch://new?device=local&prompt=consent-after-withdrawal
      - extendedWaitUntil:
          visible:
            id: ai-consent:required
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: ai-consent:cancel
      - tapOn:
          id: ai-consent:cancel
      - extendedWaitUntil:
          visible:
            id: devices:settings
          timeout: 10000
      - tapOn:
          id: devices:settings
- scrollUntilVisible:
    element:
      id: settings:privacy
    timeout: 60000
- assertVisible:
    id: settings:privacy
- scrollUntilVisible:
    element:
      id: settings:feedback
    timeout: 60000
- scrollUntilVisible:
    element:
      id: settings:licenses
    direction: DOWN
- assertVisible:
    id: settings:licenses
- scrollUntilVisible:
    element:
      id: settings:tailscale
    direction: UP
    timeout: 60000
- tapOn:
    id: settings:tailscale
- extendedWaitUntil:
    visible:
      id: tailscale:login
    timeout: 15000
- tapOn:
    id: tailscale:login
- scrollUntilVisible:
    element:
      id: tailscale:consent-cancel
    direction: DOWN
    timeout: 5000
- tapOn:
    id: tailscale:consent-cancel
- assertVisible:
    id: tailscale:login
- assertNotVisible:
    id: tailscale:progress
