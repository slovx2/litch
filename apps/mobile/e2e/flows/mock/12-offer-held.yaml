# 模拟核心：offer 卡降成提案。新建会话说“new task for Pi”→ 对话里一张“新会话 / 在这里做”的卡 → 点“新会话”→
# 模型补的简报开在 Pi 上、沙箱收不紧：卡片不开，降成待开始的提案，写明没直接开的原因，“开始”置灰 → 放宽父会话权限 → 点开始 → 卡片下面是起出来的子会话
appId: dev.litch.app
name: mock-offer卡降成提案
tags: [mock]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      READY: device:local
- tapOn:
    id: device:local
- tapOn:
    id: sessions:new
- extendedWaitUntil:
    visible:
      id: new-input
    timeout: 15000
- tapOn:
    id: new-input
- inputText: new task for Pi
- tapOn:
    id: new-send
- extendedWaitUntil:
    visible:
      id: proposal:.*:session
    timeout: 20000
- tapOn:
    id: proposal:.*:session
# 回合结束后贴底；卡片在回答和过程收起行的上方，小屏幕上要向上找原因说明。
- extendedWaitUntil:
    visible:
      id: turn-menu
    timeout: 20000
- scrollUntilVisible:
    element:
      id: proposal:.*:held
    direction: UP
    timeout: 15000
- assertVisible:
    id: proposal:.*:held
    text: .*Pi.*
- assertNotVisible:
    id: proposal:.*:child
- scrollUntilVisible:
    element:
      id: proposal:.*:start
    direction: DOWN
    centerElement: true
    timeout: 10000
# 父会话比 Pi 严：“开始”不能点（读屏名称写着原因），点了也不报错、不开
- assertVisible:
    id: proposal:.*:start
    enabled: false
- tapOn:
    id: proposal:.*:start
- assertNotVisible:
    text: .*目标 harness 不支持父会话权限.*
- assertNotVisible:
    id: proposal:.*:child
# 明确提升父会话权限后“开始”可点，才可创建 Pi 子会话。
- runFlow: ../_shared/full-access.yaml
- scrollUntilVisible:
    element:
      id: proposal:.*:start
      enabled: true
    direction: UP
    timeout: 10000
- tapOn:
    id: proposal:.*:start
# 按权限放行不等于批准向新的 Pi 服务发送数据。
- runFlow: ../_shared/allow-pi-consent.yaml
- scrollUntilVisible:
    element:
      id: proposal:.*:child
    direction: DOWN
    timeout: 15000
