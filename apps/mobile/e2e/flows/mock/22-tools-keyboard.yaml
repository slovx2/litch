appId: dev.litch.app
name: mock-终端与编辑弹窗键盘
tags:
  - mock
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: mock
      READY: device:local
- openLink: litch://terminal?device=local
- extendedWaitUntil:
    visible:
      id: terminal:key:keyboard
      enabled: true
    timeout: 15000
- tapOn:
    id: terminal:key:keyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: keyboard:done
          timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: terminal:key:ctrl
- assertVisible:
    id: header:back
- tapOn:
    id: terminal:key:ctrl
- runFlow: ../_shared/dismiss-keyboard.yaml
- assertVisible:
    id: terminal:key:ctrl
- openLink: litch://open?session=s3&device=local
- extendedWaitUntil:
    visible:
      id: user-message
    timeout: 15000
- longPressOn:
    id: user-message
- tapOn:
    id: menu:edit
- tapOn:
    id: edit:input
- runFlow:
    when:
      platform: Android
    commands:
      - longPressOn:
          id: edit:input
      - tapOn: ^(Select All|Select all|全选)$
- eraseText: 80
- inputText: Keyboard edited message
- assertVisible:
    id: edit:input
    text: Keyboard edited message
- assertVisible:
    id: edit:send
- tapOn:
    id: edit:send
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: ai-consent:title
          timeout: 10000
      - scrollUntilVisible:
          element:
            id: ai-consent:cancel
      - tapOn:
          id: ai-consent:cancel
      - assertVisible:
          id: edit:input
          text: Keyboard edited message
      - scrollUntilVisible:
          element:
            id: edit:send
      - tapOn:
          id: edit:send
      - extendedWaitUntil:
          visible:
            id: ai-consent:title
          timeout: 10000
      - scrollUntilVisible:
          element:
            id: ai-consent:allow
      - tapOn:
          id: ai-consent:allow
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible:
          id: ai-consent:title
- extendedWaitUntil:
    notVisible:
      id: edit:input
    timeout: 15000
- assertVisible:
    id: user-message
    text: Keyboard edited message
