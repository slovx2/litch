# 清掉应用的数据重新打开，等首页出来（JS 起来了、挂上了链接的监听；早于这个发的链接会丢），
# 再用测试链接换成要的装法（MODE），等那种装法才有的元素（READY）出现。
# 每个流程都从这里起：互不依赖，单跑哪一个都行
appId: dev.litch.app
---
# 启动失败保留首次诊断，由执行器上报；不在 flow 内隐藏重试。
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: devices
    timeout: 30000
- openLink: litch://boot?mode=${MODE}
# READY 多是首页的设备行；设备在经理、定时任务、「最近」下面，小屏（CI 上 320×640）要滚下去才看得见。
# 设备一台台进来时也照样滚着等
- scrollUntilVisible:
    element:
      id: ${READY}
    direction: DOWN
    timeout: 30000
