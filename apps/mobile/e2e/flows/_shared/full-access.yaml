# 仅用于隔离模拟核心：Pi 只支持完全访问；先在父会话明确确认，再允许提案继承。
appId: dev.litch.app
---
# 对话参数收在输入框的“+”里（会话页是 composer-more，新建页是 new-more）
- tapOn:
    id: (composer|new)-more
- tapOn:
    id: settings:permission
- tapOn:
    id: picker:option::danger-full-access
- tapOn:
    id: confirm:ok
- tapOn:
    id: (composer|new)-more
- extendedWaitUntil:
    visible:
      id: settings:permission
      text: .*(Full access|完全访问).*
    timeout: 10000
- pressKey: back
