appId: dev.litch.app
tags: [privacy]
---
- extendedWaitUntil:
    visible:
      id: ai-consent:title
    timeout: 10000
- assertVisible:
    text: '(?s).*pi.*gate.*'
- assertNotVisible:
    id: proposal:.*:child
- scrollUntilVisible:
    element:
      id: ai-consent:allow
    direction: DOWN
    timeout: 5000
- tapOn:
    id: ai-consent:allow
- extendedWaitUntil:
    notVisible:
      id: ai-consent:title
    timeout: 10000
