# 扫码添加到进入会话列表为止（05 号、06 号流程共用）：入口脚本替桌面端出码 → 粘贴配对文本 → 确认页 → 添加，
# 手机显示的确认码和设备服务给出码一方的一样 → 入口脚本允许 → 用手机自己的钥匙检查、添加，进到会话列表
appId: dev.litch.app
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: stored
      READY: devices:empty:add
- openLink: litch://remote?adapter=${ADAPTER}&env=LITCH_FX_MODE=${FX_MODE}
- tapOn:
    id: devices:empty:add
- extendedWaitUntil:
    visible:
      id: add:pair
    timeout: 10000
- tapOn:
    id: add:pair
- extendedWaitUntil:
    visible:
      id: pair:paste
    timeout: 10000
- runScript:
    file: ../_shared/pair-start.js
- assertTrue: ${output.pairText.length > 0}
- scrollUntilVisible:
    element:
      id: pair:paste
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: pair:paste
- inputText: ${output.pairText}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: pair:paste:go
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: pair:paste:go
- extendedWaitUntil:
    visible:
      text: e2e-pair
    timeout: 10000
- assertVisible:
    text: 127.0.0.1
- tapOn:
    id: pair:add
- extendedWaitUntil:
    visible:
      id: pair:code
    timeout: 30000
- runScript:
    file: ../_shared/pair-request.js
- assertVisible:
    text: ${output.code}
- runScript:
    file: ../_shared/pair-allow.js
- assertTrue: ${output.allowed}
- extendedWaitUntil:
    visible:
      id: sessions
    timeout: 90000
