# 输入三层取证：WebView/写入回执、shell 实际命令、文件精确内容。
appId: dev.litch.app
name: fixture-终端输入
tags: [fixture, smoke]
---
- runFlow: ../_shared/tools-session.yaml
- openLink: litch://test-terminal
# 终端
- tapOn:
    id: detail:menu
- tapOn:
    id: detail:menu:terminal
- extendedWaitUntil:
    visible:
      id: terminal:web
    timeout: 30000
# shell 的启动文件已经运行，且核心/页面均已就绪才开始输入。
- runScript:
    file: ../_shared/wait-file.js
    env:
      NAME: e2e-terminal-ready.txt
      TEXT: ready
- assertTrue: ${output.found}
- tapOn:
    id: terminal:key:keyboard
- inputText: echo e2e-$((6*7)) > e2e-mark.txt
- pressKey: Enter
- runScript:
    file: ../_shared/wait-file.js
    env:
      NAME: e2e-mark.txt
      TEXT: e2e-42
- assertTrue: ${output.found}
- runScript: ../_shared/terminal-evidence.js
- assertTrue: ${output.commandComplete}
- assertTrue: ${output.fileExact}
