# 旧桌面发送代理代填卡片时，新设备和手机忽略它；批准钥匙保留用于自身访问。
appId: dev.litch.app
name: fixture-忽略旧代理代填卡
tags: [fixture]
---
- runFlow:
    file: ../_shared/pair.yaml
- tapOn:
    id: sessions:new
- tapOn:
    id: new-input
- inputText: hello approval
- tapOn:
    id: new-send
- extendedWaitUntil:
    visible:
      text: 收到：hello approval
    timeout: 60000

- runScript:
    file: ../_shared/approval-open.js
- assertTrue: ${output.opened}
- assertNotVisible:
    id: request:signIn

# 设置里的指纹和扫码时送来的批准公钥对得上
- tapOn:
    id: header:back
- tapOn:
    id: header:back
- extendedWaitUntil:
    visible:
      id: devices:settings
    timeout: 30000
- tapOn:
    id: devices:settings
- runScript:
    file: ../_shared/approval-fingerprint.js
- scrollUntilVisible:
    element:
      id: settings:approval-key:fingerprint
    direction: DOWN
- assertVisible:
    id: settings:approval-key:fingerprint
    text: ${output.fingerprint}
- tapOn:
    id: header:back

# 收尾：移除设备、撤钥匙，清锁屏密码
# 新加的设备在首页经理、定时任务、「最近」下面，小屏要滚下去
- scrollUntilVisible:
    element:
      text: .*e2e-pair.*
    direction: DOWN
    timeout: 30000
- tapOn:
    id: device:.*:more
- tapOn:
    id: menu:remove
- extendedWaitUntil:
    visible:
      id: remove:revoke
    timeout: 10000
- tapOn:
    id: confirm:ok
- extendedWaitUntil:
    visible:
      id: devices:empty:add
    timeout: 30000
- runScript:
    file: ../_shared/pair-phones.js
- assertTrue: ${output.phones == 0 && output.keyLines == 0}
