# 仅连接回环上的无服务 HTTPS 地址；不打开真实登录页，不使用 Tailscale 账户。
appId: '${typeof APP_ID === "undefined" ? "dev.litch.app" : APP_ID}'
name: 内嵌 Tailscale 初始化与未登录保护
tags: [fixture, native]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: devices:add
    timeout: 15000
- tapOn:
    id: devices:add
- assertVisible:
    id: tailscale:mode
- tapOn:
    id: tailscale:mode
- tapOn:
    id: tailscale:mode:always
- tapOn:
    id: tailscale:guide
- assertVisible:
    id: tailscale:state
- assertNotVisible:
    id: tailscale:unavailable
- tapOn:
    id: tailscale:advanced
- tapOn:
    id: tailscale:control
- inputText: http://127.0.0.1:9
- runFlow: ../_shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: tailscale:login
    direction: UP
- assertVisible:
    id: tailscale:login
- tapOn:
    id: tailscale:login
- runFlow: ../_shared/allow-tailscale-consent.yaml
- scrollUntilVisible:
    element:
      id: tailscale:error
    direction: DOWN
- assertVisible:
    id: tailscale:error
# 点字段后光标可能在中间；全选替换并校验完整地址，避免保留右侧的端口后缀。
- longPressOn:
    id: tailscale:control
# Android 的 URL 长按会直接选中整段，此时菜单没有“全选”。其他选择状态才点全选。
- runFlow:
    when:
      visible: '^(Select All|Select all|全选)$'
    commands:
      - tapOn: '^(Select All|Select all|全选)$'
- inputText: https://127.0.0.1:9
- assertVisible:
    id: tailscale:control
    text: 'https://127\.0\.0\.1:9'
- runFlow: ../_shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: tailscale:login
    direction: UP
- tapOn:
    id: tailscale:login
- runFlow: ../_shared/allow-tailscale-consent.yaml
- scrollUntilVisible:
    element:
      id: tailscale:state
    direction: UP
- extendedWaitUntil:
    visible:
      text: 未登录|Signed out|连接中|Connecting
    timeout: 15000
- assertNotVisible:
    id: tailscale:error
- scrollUntilVisible:
    element:
      id: tailscale:error
    direction: DOWN
    timeout: 40000
- scrollUntilVisible:
    element:
      id: tailscale:clear
    direction: UP
- tapOn:
    id: tailscale:clear
- tapOn:
    id: confirm:ok
- scrollUntilVisible:
    element:
      id: tailscale:state
    direction: UP
- extendedWaitUntil:
    visible:
      text: 未连接|Disconnected
    timeout: 10000
- scrollUntilVisible:
    element:
      id: tailscale:back
    direction: DOWN
- tapOn:
    id: tailscale:back
- assertVisible:
    id: add-device
- tapOn:
    id: add:host
- inputText: 100.64.0.2
- tapOn:
    id: add:user
- inputText: test
- assertVisible:
    id: add:check
- assertVisible:
    id: add:submit
- runFlow: ../_shared/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: key:generate
- tapOn:
    id: key:generate
- scrollUntilVisible:
    element:
      id: add:check
- tapOn:
    id: add:check
- extendedWaitUntil:
    visible:
      text: .*Tailscale.*
      id: add:error
    timeout: 10000
- assertVisible:
    text: .*请先.*登录.*|.*Sign in in Tailscale settings.*
