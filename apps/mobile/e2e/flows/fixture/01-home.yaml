# 夹具（真的适配器经 SSH）：首页列出夹具那台设备，设备详情里列出它上面的 harness，点进去是会话列表
appId: dev.litch.app
name: fixture-首页列出设备与 harness
tags: [fixture, smoke]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: fixture
      READY: device:fixture
- tapOn:
    id: device:fixture:more
- tapOn:
    id: menu:detail
# 设备服务报上来 9 个 harness（夹具里只装了 Pi，其余标着没装）
# 屏幕小（CI 上是 320×640）时这一行在下面，要滚下去才看得见
- scrollUntilVisible:
    element:
      text: .*(Device service, 9 harnesses|设备服务，9 个 harness).*
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: harness:pi
    direction: DOWN
# 概览显示名称和状态；版本与实际路径在详情的运行设置中。
- assertVisible:
    text: Pi (Ready|可用)
- tapOn:
    id: harness:pi:settings
- extendedWaitUntil:
    visible:
      id: harness:pi:runtime
    timeout: 20000
- assertVisible:
    text: .*\d+\.\d+\.\d+ · .*
- tapOn:
    id: header:back
- tapOn:
    id: header:back
- scrollUntilVisible:
    element:
      id: device:fixture
    direction: DOWN
- tapOn:
    id: device:fixture
- extendedWaitUntil:
    visible:
      id: sessions
    timeout: 15000
