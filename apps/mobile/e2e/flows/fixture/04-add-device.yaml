# 真实设备方式（stored）从零加一台设备，连的是夹具的 sshd：手机上生成钥匙 → 首次连接核对主机指纹 →
# 公钥还没授权，检查报登录被拒 → 在“电脑上”授权（入口脚本的小口替人把公钥写进 authorized_keys）→
# 再检查看到设备服务 → 添加，进到这台设备的会话列表
appId: dev.litch.app
name: fixture-从零加设备
tags: [fixture]
---
- runFlow:
    file: ../_shared/fresh.yaml
    env:
      MODE: stored
      READY: devices:empty:add
# 夹具里适配器的命令名是个替身、sshd 靠环境变量分情形：经测试链接告诉手机
- openLink: litch://remote?adapter=${ADAPTER}&env=LITCH_FX_MODE=${FX_MODE}
- tapOn:
    id: devices:empty:add
- extendedWaitUntil:
    visible:
      id: add:host
    timeout: 10000
- tapOn:
    id: add:host
- inputText: 127.0.0.1
- tapOn:
    id: add:port
- eraseText: 10
- inputText: ${FIXTURE_PORT}
- tapOn:
    id: add:user
- inputText: ${FIXTURE_USER}
- tapOn:
    id: add:name
- inputText: e2e-box
- hideKeyboard
- scrollUntilVisible:
    element:
      id: key:generate
    direction: DOWN
- tapOn:
    id: key:generate
- scrollUntilVisible:
    element:
      text: ssh-ed25519 [A-Za-z0-9+/=]+.*
    direction: DOWN
- copyTextFrom:
    text: ssh-ed25519 [A-Za-z0-9+/=]+.*
- scrollUntilVisible:
    element:
      id: add:check
    direction: DOWN
- tapOn:
    id: add:check
# 首次连接：确认框里的指纹要和夹具主机钥匙的一样
- extendedWaitUntil:
    visible:
      text: .*${FINGERPRINT_RE}.*
    timeout: 20000
- tapOn:
    id: confirm:ok
- scrollUntilVisible:
    element:
      id: failure:auth
    direction: DOWN
    timeout: 30000
- runScript:
    file: ../_shared/authorize.js
- assertTrue: ${output.authorized}
- scrollUntilVisible:
    element:
      id: add:check
    direction: UP
- tapOn:
    id: add:check
- scrollUntilVisible:
    element:
      id: check:service
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: add:submit
    direction: DOWN
- tapOn:
    id: add:submit
- extendedWaitUntil:
    visible:
      id: sessions
    timeout: 30000
- tapOn:
    id: header:back
- extendedWaitUntil:
    visible:
      text: .*e2e-box.*
    timeout: 15000
