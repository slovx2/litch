# 只用隔离 sshd 的参数；KEY 来自 fixture.mjs，不能传真实用户私钥。
appId: dev.litch.app.dev
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: devices
    timeout: 30000
- openLink: litch-dev://remote?adapter=${ADAPTER}&env=LITCH_FX_MODE=svc
- tapOn:
    id: devices:settings
- scrollUntilVisible:
    element:
      id: update:ios
    direction: DOWN
- assertVisible:
    id: update:ios
- assertNotVisible:
    id: update:check
- assertNotVisible:
    id: update:auto
- openLink: litch-dev://home
- tapOn:
    id: devices:empty:add
- tapOn:
    id: add:host
- inputText: 127.0.0.1
- hideKeyboard
- scrollUntilVisible:
    element:
      id: add:port
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: add:port
- eraseText
- inputText: ${PORT}
- hideKeyboard
- tapOn:
    id: add:user
- inputText: ${USER}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: key:import
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: key:import
    retryTapIfNoChange: false
- scrollUntilVisible:
    element:
      id: key:paste
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: key:paste
- inputText: ${KEY}
- assertVisible:
    id: key:paste
    text: '(?s)-----BEGIN OPENSSH PRIVATE KEY-----.*-----END OPENSSH PRIVATE KEY-----\s*'
# 多行私钥的回车是换行。默认整屏滚动会落在键盘/完成条上；只在表单左侧留白区域滚动。
# 保持键盘展开，并要求导入按钮位于固定操作栏上方，不能把被操作栏覆盖的 AX 节点当作可点击。
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            notVisible:
              id: key:doImport
              above:
                id: add:check
          commands:
            - swipe:
                start: 2%, 38%
                end: 2%, 18%
                duration: 500
- waitForAnimationToEnd
- assertVisible:
    id: keyboard:done
- assertVisible:
    id: key:doImport
    enabled: true
    above:
      id: add:check
- tapOn:
    id: key:doImport
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: key:copy
    timeout: 10000
- scrollUntilVisible:
    element:
      id: add:check
    direction: DOWN
- tapOn:
    id: add:check
- extendedWaitUntil:
    visible: 'Trust|信任'
    timeout: 20000
- tapOn: 'Trust|信任'
- extendedWaitUntil:
    visible:
      id: check:service
    timeout: 60000
- scrollUntilVisible:
    element:
      id: add:submit
    direction: DOWN
- tapOn:
    id: add:submit
- extendedWaitUntil:
    visible:
      id: sessions:list
    timeout: 90000
- assertNotVisible:
    id: sessions:failure
