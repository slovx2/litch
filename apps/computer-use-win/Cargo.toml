# Litch 在 Windows 上的 Computer Use 助手：主进程以子进程拉起，经标准输入输出说 JSON-RPC（09 号设计第 9.2 节）。
# 依赖一律写死精确版本；纯逻辑的模块在任何平台都能编译和测试，用到系统接口的部分只在 Windows 上编译。
# 自成一个 workspace：不进仓库根目录那个（那是适配器协议的 crate），Cargo.lock 放在这个目录里。
[workspace]

[package]
name = "litch-computer-use"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "litch-computer-use"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.61.3"
features = [
  "Foundation",
  "Foundation_Metadata",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
